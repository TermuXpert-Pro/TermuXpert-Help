name: تحديث لوحة المتصدرين تلقائياً

on:
  push:
    paths:
      - 'data/users/*.json'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
        
      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: تجميع وترتيب المستخدمين
        run: |
          python3 << 'PYTHON'
          import json, glob, os, datetime
          
          users = []
          for file in glob.glob('data/users/*.json'):
              if '.gitkeep' in file: continue
              try:
                  with open(file, 'r', encoding='utf-8') as f:
                      user = json.load(f)
                      # حساب النقاط
                      lessons_score = user.get('completedLessons', 0) * 10
                      time_score = (user.get('totalTime', 0) // 3600) * 5
                      tools_score = user.get('toolsUsed', 0) * 2
                      user['score'] = lessons_score + time_score + tools_score
                      users.append(user)
              except Exception as e:
                  print(f"خطأ في {file}: {e}")
          
          # ترتيب حسب النقاط (من الأعلى إلى الأقل)
          users.sort(key=lambda x: x.get('score', 0), reverse=True)
          
          # إضافة الترتيب
          for i, user in enumerate(users, 1):
              user['rank'] = i
          
          # حفظ أفضل 100 مستخدم
          with open('data/leaderboard.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'lastUpdate': datetime.datetime.now().isoformat(),
                  'totalUsers': len(users),
                  'top100': users[:100]
              }, f, ensure_ascii=False, indent=2)
          
          print(f"✅ تم تجميع {len(users)} مستخدم")
          PYTHON
      
      - name: رفع التغييرات
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 تحديث تلقائي للوحة المتصدرين"
          file_pattern: "data/leaderboard.json"
          commit_user_name: "TermuXpert Bot"
          commit_user_email: "bot@termuxpert.com"
