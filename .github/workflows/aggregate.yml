name: تجميع بيانات المستخدمين

on:
  push:
    paths:
      - 'data/users/*.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: تجميع البيانات
        run: |
          python3 << 'PYTHON'
          import json, os, glob
          
          users = []
          for file in glob.glob('data/users/*.json'):
              if '.gitkeep' in file: continue
              try:
                  with open(file, 'r', encoding='utf-8') as f:
                      user = json.load(f)
                      score = user.get('completedLessons', 0) * 10
                      score += (user.get('totalTime', 0) // 3600) * 5
                      score += user.get('toolsUsed', 0) * 2
                      user['score'] = score
                      users.append(user)
              except:
                  pass
          
          users.sort(key=lambda x: x.get('score', 0), reverse=True)
          for i, user in enumerate(users[:100], 1):
              user['rank'] = i
          
          with open('data/leaderboard.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'lastUpdate': __import__('datetime').datetime.now().isoformat(),
                  'totalUsers': len(users),
                  'top100': users[:100]
              }, f, ensure_ascii=False, indent=2)
          
          print(f"✅ تم تجميع {len(users)} مستخدم")
          PYTHON
      
      - name: رفع التغييرات
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 تحديث تلقائي للوحة المتصدرين"
          file_pattern: "data/leaderboard.json"
