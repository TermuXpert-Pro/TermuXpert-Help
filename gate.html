<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>وصول مقيّد | Xpert</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-primary:#0B0C10;
    --bg-card:#1F2833;
    --border:#2A3340;
    --accent:#45A29E;
    --accent-light:#66FCF1;
    --text-primary:#FFFFFF;
    --text-secondary:#C5C6C7;
    --text-muted:#8A8D93;
    --gradient:linear-gradient(135deg, #45A29E, #66FCF1);
    --danger:#E5534B;
    --font-main:'Cairo','Inter',sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}

  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--font-main);
    position:relative;
    overflow:hidden;
  }

  /* ====== توهج الخلفية، نفس أسلوب الموقع ====== */
  .glow-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.16;
    z-index:0;
    pointer-events:none;
  }
  .glow-orb-1{width:clamp(180px,32vw,320px);height:clamp(180px,32vw,320px);background:var(--accent);top:-8%;right:-8%;}
  .glow-orb-2{width:clamp(160px,28vw,280px);height:clamp(160px,28vw,280px);background:var(--accent-light);bottom:-10%;left:-10%;}

  .gate-card{
    position:relative;
    z-index:1;
    width:min(92vw, 420px);
    background:var(--bg-card);
    border:1px solid var(--border);
    border-right:3px solid var(--danger);
    border-radius:14px;
    padding:34px 28px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  }

  .status-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(229,83,75,0.1);
    border:1px solid rgba(229,83,75,0.3);
    color:var(--danger);
    padding:5px 12px;
    border-radius:50px;
    font-size:12px;
    font-weight:600;
    margin-bottom:16px;
  }
  .status-tag svg{width:12px;height:12px;flex-shrink:0;}

  h1{
    font-size:clamp(20px,4.5vw,24px);
    font-weight:800;
    line-height:1.5;
    margin:0 0 12px;
    color:var(--text-primary);
  }

  p.lede{
    font-size:14px;
    line-height:1.85;
    color:var(--text-secondary);
    margin:0 0 26px;
  }

  form{display:flex;flex-direction:column;gap:10px;}

  label{
    font-size:12.5px;
    color:var(--text-muted);
    font-weight:600;
  }

  input[type="password"]{
    font-family:var(--font-mono);
    font-size:19px;
    letter-spacing:5px;
    text-align:center;
    padding:13px 14px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--bg-primary);
    color:var(--text-primary);
    transition:border-color 150ms ease, box-shadow 150ms ease;
  }
  input::placeholder{color:var(--text-muted);letter-spacing:4px;}
  input:focus-visible{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(69,162,158,0.18);
  }

  button{
    font-family:var(--font-main);
    font-size:15px;
    font-weight:700;
    padding:13px 16px;
    border:none;
    border-radius:10px;
    background:var(--gradient);
    color:var(--bg-primary);
    cursor:pointer;
    box-shadow:0 4px 20px rgba(69,162,158,0.2);
    transition:opacity 150ms ease, transform 120ms ease;
  }
  button:hover{opacity:0.9;}
  button:active{transform:translateY(1px);}
  button:disabled{background:var(--border);color:var(--text-muted);box-shadow:none;cursor:not-allowed;}

  .msg{min-height:18px;font-size:13px;margin-top:2px;font-weight:600;}
  .msg.error{color:var(--danger);}
  .msg.wait{color:#E5A54B;}

  .shake{animation:shake 400ms ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(3px);}
  }

  .divider{width:36px;height:2px;background:var(--gradient);border-radius:1px;margin:26px 0 16px;}

  .dua{
    font-size:13px;
    color:var(--text-muted);
    line-height:1.8;
    margin:0;
  }
</style>
</head>
<body>

  <div class="glow-orb glow-orb-1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-2" aria-hidden="true"></div>

  <main class="gate-card" id="gateCard">
    <span class="status-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      وصول مقيّد
    </span>

    <h1>هذه الصفحة محظورة على العموم</h1>
    <p class="lede">
      المحتوى غير مخصص للزيارة العامة، ولا يُفتح إلا برمز دخول صحيح.
      كل محاولة برمز خاطئ تُرفض تلقائياً.
    </p>

    <form id="gateForm" autocomplete="off" novalidate>
      <label for="gateInput">رمز الدخول</label>
      <input
        id="gateInput"
        name="gateInput"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="12"
        placeholder="••••••••"
        aria-describedby="gateMsg"
        required
      >
      <button type="submit" id="gateBtn">تحقّق من الرمز</button>
      <p class="msg" id="gateMsg" role="status" aria-live="polite"></p>
    </form>

    <div class="divider" aria-hidden="true"></div>
    <p class="dua">اللهم زدنا علماً نافعاً، ورزقاً طيباً مباركاً</p>
  </main>

<script>
(function(){
  var STORAGE_KEY   = 'xpert_gate_ok';
  var ATTEMPTS_KEY   = 'xpert_gate_attempts';
  var LOCK_KEY       = 'xpert_gate_lock_until';
  var MAX_ATTEMPTS    = 5;
  var LOCK_SECONDS     = 60;
  var VALID_CODE       = '2008328';
  var DEFAULT_REDIRECT = 'index.html';

  var form   = document.getElementById('gateForm');
  var input  = document.getElementById('gateInput');
  var btn    = document.getElementById('gateBtn');
  var msg    = document.getElementById('gateMsg');
  var card   = document.getElementById('gateCard');
  var timer  = null;

  function getNext(){
    var params = new URLSearchParams(location.search);
    var next = params.get('next');
    if (!next) return DEFAULT_REDIRECT;
    try{
      var url = new URL(next, location.href);
      if (url.origin === location.origin) return url.href;
    }catch(e){}
    return DEFAULT_REDIRECT;
  }

  function lockRemaining(){
    var until = parseInt(sessionStorage.getItem(LOCK_KEY) || '0', 10);
    var remaining = Math.ceil((until - Date.now()) / 1000);
    return remaining > 0 ? remaining : 0;
  }

  function setLocked(seconds){
    input.disabled = true;
    btn.disabled = true;
    msg.className = 'msg wait';
    var update = function(){
      var r = lockRemaining();
      if (r <= 0){
        clearInterval(timer);
        input.disabled = false;
        btn.disabled = false;
        msg.textContent = '';
        msg.className = 'msg';
        return;
      }
      msg.textContent = 'تم رفض الوصول مؤقتاً، أعد المحاولة بعد ' + r + ' ثانية';
    };
    clearInterval(timer);
    timer = setInterval(update, 1000);
    update();
  }

  function registerFailure(){
    var attempts = parseInt(sessionStorage.getItem(ATTEMPTS_KEY) || '0', 10) + 1;
    sessionStorage.setItem(ATTEMPTS_KEY, String(attempts));
    if (attempts >= MAX_ATTEMPTS){
      sessionStorage.setItem(LOCK_KEY, String(Date.now() + LOCK_SECONDS * 1000));
      sessionStorage.setItem(ATTEMPTS_KEY, '0');
      setLocked(LOCK_SECONDS);
    }
  }

  if (lockRemaining() > 0){
    setLocked(lockRemaining());
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (lockRemaining() > 0) return;

    var value = input.value.trim();
    if (value === VALID_CODE){
      try{ localStorage.setItem(STORAGE_KEY, '1'); }catch(err){}
      sessionStorage.removeItem(ATTEMPTS_KEY);
      msg.className = 'msg';
      msg.textContent = 'تم قبول الرمز...';
      location.replace(getNext());
    } else {
      msg.className = 'msg error';
      msg.textContent = 'رمز خاطئ. الدخول مرفوض.';
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      input.value = '';
      input.focus();
      registerFailure();
    }
  });
})();
</script>
</body>
</html>
