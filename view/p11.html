<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Xpert — المقدمة الترويجية والافتتاحية المبهرة</title>

<!-- الخطوط العربية والأيقونات -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- مكتبات الأنيميشن والمؤثرات البصرية -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  :root {
    --bg-0: #040a09;
    --bg-1: #081514;
    --bg-2: #0d2220;
    --teal: #4ECDC4;
    --teal-glow: rgba(78, 205, 196, 0.6);
    --gold: #F4D03F;
    --gold-glow: rgba(244, 208, 63, 0.6);
    --orange: #E8873A;
    --purple: #BB8FCE;
    --text: #ffffff;
    --muted: #a3ccc4;
    --card-bg: rgba(12, 28, 26, 0.85);
    --line: rgba(78, 205, 196, 0.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-0); overflow: hidden; }
  body { font-family: 'Tajawal', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

  /* ---------- Stage Canvas Background ---------- */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 30%, rgba(78, 205, 196, 0.18), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(244, 208, 63, 0.1), transparent 50%),
      linear-gradient(165deg, var(--bg-0), var(--bg-1) 50%, var(--bg-2));
  }

  /* خلفية الجسيمات التفاعلية الثلاثية الأبعاد */
  #particlesCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }

  /* خلفية النقوش المغربية */
  .zellij-pattern {
    position: absolute; inset: 0; opacity: 0.15; pointer-events: none; z-index: 2;
  }

  /* ---------- Main Scene Container ---------- */
  .scene {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 3vh 4vw; text-align: center;
  }

  /* ---------- Intro Big Branding Logo ---------- */
  .brand-container {
    opacity: 0; transform: scale(0.5);
    margin-bottom: 20px; position: relative;
    direction: ltr; /* ضمان العرض الصحيح للشعار اللاتيني */
  }

  .brand-logo-text {
    font-family: 'Cairo', sans-serif; font-weight: 900;
    font-size: clamp(48px, 9vw, 95px); line-height: 1;
    letter-spacing: -1px; color: #ffffff;
    text-shadow: 0 0 20px var(--teal-glow), 0 0 40px var(--teal-glow);
    display: inline-flex; align-items: center; justify-content: center;
    direction: ltr; unicode-bidi: isolate;
  }
  .brand-logo-text .x-accent {
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold-glow), 0 0 40px var(--gold-glow);
    display: inline-block;
  }

  .brand-tagline {
    font-family: 'Cairo', sans-serif; font-weight: 800;
    font-size: clamp(14px, 2vw, 20px); color: var(--teal);
    letter-spacing: 1px;
    margin-top: 8px; opacity: 0; transform: translateY(10px);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    direction: ltr; unicode-bidi: isolate;
  }
  .brand-tagline .star-icon {
    color: var(--gold); font-size: 14px;
  }

  /* ---------- Message Cards Sequence ---------- */
  .card-container {
    width: min(720px, 92vw); position: relative; min-height: 220px;
    display: flex; align-items: center; justify-content: center;
  }

  .msg-card {
    background: var(--card-bg);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.1);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: translateY(30px) scale(0.92); pointer-events: none;
  }
  .msg-card.active { pointer-events: auto; }

  /* Message 1 Specific Style */
  .msg-badge {
    background: rgba(244, 208, 63, 0.15); border: 1px solid var(--gold);
    color: var(--gold); font-size: clamp(12px, 1.4vw, 14px); font-weight: 800;
    padding: 6px 16px; border-radius: 30px; margin-bottom: 14px;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 0 15px rgba(244, 208, 63, 0.2);
  }

  .msg-text-main {
    font-family: 'Cairo', sans-serif; font-size: clamp(18px, 3.2vw, 28px);
    font-weight: 800; line-height: 1.45; color: #ffffff; margin: 0;
  }
  .msg-text-main .highlight-gold {
    color: var(--gold); text-shadow: 0 0 12px rgba(244,208,63,0.4);
    display: inline-block; direction: ltr; unicode-bidi: isolate;
  }
  .msg-text-main .highlight-teal {
    color: var(--teal); text-shadow: 0 0 12px rgba(78,205,196,0.4);
  }

  /* Message 2 Specific Style */
  .share-icon-wrap {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(13, 34, 32, 0.9);
    border: 1.5px solid var(--gold);
    color: var(--gold); display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin-bottom: 12px;
    box-shadow: 0 0 25px var(--gold-glow);
    text-shadow: 0 0 10px var(--gold-glow);
  }

  .msg-text-share {
    font-family: 'Cairo', sans-serif; font-size: clamp(16px, 2.8vw, 24px);
    font-weight: 800; line-height: 1.5; color: #eaf6f4; margin: 0;
  }

  /* ---------- Progress & Controls ---------- */
.replay-btn {
    position: absolute; top: 20px; left: 20px; z-index: 30; font-size: 12px;
    font-family: 'Cairo', sans-serif; font-weight: 700; color: var(--muted);
    background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    padding: 8px 18px; border-radius: 24px; cursor: pointer;
    transition: all 0.3s ease; backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: auto;
  }
  .replay-btn:hover {
    color: #ffffff; border-color: var(--teal); box-shadow: 0 0 15px var(--teal-glow);
  }
</style>
</head>
<body>

<div class="stage">
  <!-- خلفية الجسيمات الشبكية ثلاثية الأبعاد -->
  <canvas id="particlesCanvas"></canvas>

  <!-- زخرفة الزليج المضيئة -->
  <div class="zellij-pattern">
    <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <pattern id="zellijIntro" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
        <polygon points="80,0 160,80 80,160 0,80" fill="none" stroke="#4ECDC4" stroke-width="0.7"/>
        <polygon points="80,30 130,80 80,130 30,80" fill="none" stroke="#F4D03F" stroke-width="0.5"/>
      </pattern>
      <rect width="800" height="800" fill="url(#zellijIntro)"/>
    </svg>
  </div>

  <button class="replay-btn" id="replayBtn"><i class="fas fa-rotate-right"></i> إعادة العرض</button>

  <section class="scene">
    
    <!-- Big Glowing Logo Brand (ضبط الاتجاه والتنسيق اللاتيني) -->
    <div class="brand-container" id="brandContainer">
      <div class="brand-logo-text" dir="ltr"><span class="x-accent">X</span>pert</div>
      <div class="brand-tagline" id="brandTagline" dir="ltr">
        <span class="star-icon">✦</span>
        <span>1 Bac Sciences Expérimentales</span>
        <span class="star-icon">✦</span>
      </div>
    </div>

    <!-- Cards Container Sequence -->
    <div class="card-container">
      
      <!-- Card 1: Main Hook Message -->
      <div class="msg-card" id="card1">
        <div class="msg-badge"><i class="fas fa-star"></i> فرصة التميز في الأولى باك</div>
        <p class="msg-text-main">
          إذا كنت مقبلاً على مستوى <span class="highlight-gold" dir="ltr">1Bac علوم تجريبية</span>، لا تحرم نفسك من هذا الفيديو و<span class="highlight-teal">الموقع الاستثنائي</span> الذي سنعرضه لك! 🚀
        </p>
      </div>

      <!-- Card 2: Share and Support Call To Action -->
      <div class="msg-card" id="card2">
        <div class="share-icon-wrap" id="shareIconPulse"><i class="fas fa-paper-plane"></i></div>
        <p class="msg-text-share">
          نتمنى أن تكمل الفيديو حتى <span class="highlight-gold">الأخير</span> وتشاركه مع أصدقائك، فهذه هي <span class="highlight-teal">الوسيلة الوحيدة</span> لنشره ووصوله للجميع! ❤️
        </p>
      </div>

    </div>

  </section>

  <!-- Progress Fill Bar -->
</div>

<script>
  /* ========================================================
     1. THREE-D PARTICLES & CONNECTING NETWORK CANVAS ENGINE
     ======================================================== */
  const canvas = document.getElementById('particlesCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const particles = [];
  const particleCount = Math.min(65, Math.floor(window.innerWidth / 20));

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = (Math.random() - 0.5) * 0.8;
      this.radius = Math.random() * 2 + 1;
      this.color = Math.random() > 0.4 ? '#4ECDC4' : '#F4D03F';
      this.alpha = Math.random() * 0.5 + 0.3;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.alpha;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw connecting lines
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = '#4ECDC4';
          ctx.globalAlpha = (1 - dist / 120) * 0.18;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    particles.forEach(p => {
      p.update();
      p.draw();
    });

    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  /* ========================================================
     2. FIRE CONFETTI CELEBRATION FUNCTION
     ======================================================== */
  function triggerConfetti() {
    if (typeof confetti === 'function') {
      confetti({
        particleCount: 70,
        spread: 80,
        origin: { y: 0.4 },
        colors: ['#4ECDC4', '#F4D03F', '#BB8FCE', '#ffffff']
      });
    }
  }

  /* ========================================================
     3. TIMELINE & SCENE ANIMATION (GSAP 16 Seconds Total)
     ======================================================== */
  const totalDuration = 16.0;
  const tl = gsap.timeline({ paused: false });

  // Reset function for replay
  function resetScene() {
    gsap.set("#brandContainer", { opacity: 0, scale: 0.5 });
    gsap.set("#brandTagline", { opacity: 0, y: 10 });
    gsap.set("#card1", { opacity: 0, y: 30, scale: 0.92, className: "msg-card" });
    gsap.set("#card2", { opacity: 0, y: 30, scale: 0.92, className: "msg-card" });
  }

  // 0.0s - Progress Bar Sync
  // 0.5s - Logo Appearance & Scale-Up with Confetti Celebration
  tl.to("#brandContainer", {
    opacity: 1, scale: 1, duration: 1.0, ease: "back.out(1.7)"
  }, 0.5);

  tl.call(() => triggerConfetti(), null, 1.0);

  tl.to("#brandTagline", {
    opacity: 1, y: 0, duration: 0.6, ease: "power2.out"
  }, 1.2);

  // 2.2s - Reveal Card 1 (Main Hook Statement)
  tl.to("#card1", {
    opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.4)",
    className: "msg-card active"
  }, 2.2);

  // Subtle pulsing on Gold highlight inside Card 1
  tl.to("#card1 .highlight-gold", {
    scale: 1.05, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut"
  }, 3.5);

  // 8.0s - Transition Card 1 Out & Card 2 In (Share & Support Callout)
  tl.to("#card1", {
    opacity: 0, y: -20, scale: 0.95, duration: 0.6, ease: "power2.in",
    className: "msg-card"
  }, 7.8);

  tl.to("#card2", {
    opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.4)",
    className: "msg-card active"
  }, 8.5);

  // Pulse animation on Share Icon
  tl.to("#shareIconPulse", {
    scale: 1.25, boxShadow: "0 0 35px rgba(244,208,63,0.9)",
    duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut"
  }, 9.5);

  // 14.5s - Smooth Fade for End of Intro
  tl.to("#card2", {
    scale: 1.03, duration: 1.0, ease: "sine.inOut"
  }, 13.5);

  // Replay Button Action
  document.getElementById("replayBtn").addEventListener("click", () => {
    resetScene();
    tl.restart();
  });
</script>

</body>
</html>
