<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js - Scene</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0B0C10; }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #C5C6C7;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            color: #C5C6C7;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: #FF6B6B;
            color: #FF6B6B;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(197,198,199,0.3);
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Retour</a>
    <div class="info">🤖 Personnage 3D avec animation de salutation</div>

    <canvas id="canvas-container"></canvas>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        (function() {
            // ============================================================
            // 1. Création du moteur et de la scène
            // ============================================================
            const canvas = document.getElementById('canvas-container');
            const engine = new BABYLON.Engine(canvas, true, { 
                preserveDrawingBuffer: true, 
                stencil: true 
            });

            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.043, 0.047, 0.063, 1);

            // ============================================================
            // 2. Caméra
            // ============================================================
            const camera = new BABYLON.ArcRotateCamera(
                "camera", 
                -Math.PI / 2,  // alpha
                1.2,           // beta
                8,             // radius
                new BABYLON.Vector3(0, 1.5, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;
            camera.lowerRadiusLimit = 4;
            camera.upperRadiusLimit = 15;
            camera.panningSensibility = 0;

            // ============================================================
            // 3. إضاءة
            // ============================================================
            // إضاءة محيطية
            const ambientLight = new BABYLON.HemisphericLight(
                "ambient", 
                new BABYLON.Vector3(0, 1, 0), 
                scene
            );
            ambientLight.intensity = 0.3;

            // إضاءة رئيسية
            const mainLight = new BABYLON.DirectionalLight(
                "main", 
                new BABYLON.Vector3(1, 2, 1), 
                scene
            );
            mainLight.intensity = 0.8;
            mainLight.position = new BABYLON.Vector3(5, 10, 5);

            // إضاءة خلفية
            const backLight = new BABYLON.DirectionalLight(
                "back", 
                new BABYLON.Vector3(-1, 0.5, -1), 
                scene
            );
            backLight.intensity = 0.4;

            // ============================================================
            // 4. أرضية
            // ============================================================
            const ground = BABYLON.MeshBuilder.CreateGround(
                "ground",
                { width: 12, height: 12 },
                scene
            );
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.08, 0.09, 0.12);
            groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
            groundMat.emissiveColor = new BABYLON.Color3(0.02, 0.025, 0.035);
            ground.material = groundMat;
            ground.position.y = -0.5;

            // شبكة للأرضية
            const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
            gridMat.diffuseColor = new BABYLON.Color3(0.1, 0.12, 0.16);
            gridMat.emissiveColor = new BABYLON.Color3(0.05, 0.06, 0.08);
            gridMat.alpha = 0.3;
            const grid = BABYLON.MeshBuilder.CreateGround(
                "grid",
                { width: 10, height: 10, subdivisions: 20 },
                scene
            );
            grid.material = gridMat;
            grid.position.y = -0.48;

            // ============================================================
            // 5. إنشاء الشخصية (BoxHuman)
            // ============================================================
            const characterGroup = new BABYLON.TransformNode("character", scene);
            
            // الألوان
            const skinColor = new BABYLON.Color3(0.95, 0.78, 0.6);
            const clothColor = new BABYLON.Color3(0.2, 0.5, 0.8);
            const pantsColor = new BABYLON.Color3(0.15, 0.2, 0.35);
            const shoeColor = new BABYLON.Color3(0.1, 0.1, 0.12);
            const eyeColor = new BABYLON.Color3(0.3, 0.8, 0.9);

            // === المواد ===
            function createMat(color, emissive = null, specular = null) {
                const mat = new BABYLON.StandardMaterial("mat", scene);
                mat.diffuseColor = color;
                if (emissive) mat.emissiveColor = emissive;
                if (specular) mat.specularColor = specular;
                else mat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                mat.backFaceCulling = false;
                return mat;
            }

            // === الجسم ===
            const body = BABYLON.MeshBuilder.CreateBox("body", { width: 0.8, height: 1, depth: 0.5 }, scene);
            body.material = createMat(clothColor);
            body.position.y = 1.3;
            body.parent = characterGroup;

            // === الرأس ===
            const head = BABYLON.MeshBuilder.CreateSphere("head", { diameter: 0.5 }, scene);
            head.material = createMat(skinColor);
            head.position.y = 2.1;
            head.parent = characterGroup;

            // === العينان ===
            const eyeMat = createMat(new BABYLON.Color3(1, 1, 1));
            const pupilMat = createMat(new BABYLON.Color3(0.05, 0.05, 0.1));

            function createEye(x, z) {
                const eyeGroup = new BABYLON.TransformNode("eye", scene);
                
                const eye = BABYLON.MeshBuilder.CreateSphere("eye", { diameter: 0.12 }, scene);
                eye.material = eyeMat;
                eye.position.set(x, 2.2, 0.35 + z);
                eye.parent = characterGroup;
                
                const pupil = BABYLON.MeshBuilder.CreateSphere("pupil", { diameter: 0.06 }, scene);
                pupil.material = pupilMat;
                pupil.position.set(x, 2.18, 0.45 + z);
                pupil.parent = characterGroup;
                
                return { eye, pupil };
            }

            createEye(-0.15, 0);
            createEye(0.15, 0);

            // === الفم (خط صغير) ===
            const mouthMat = createMat(new BABYLON.Color3(0.4, 0.2, 0.15));
            const mouth = BABYLON.MeshBuilder.CreateBox("mouth", { width: 0.15, height: 0.03, depth: 0.02 }, scene);
            mouth.material = mouthMat;
            mouth.position.set(0, 1.92, 0.32);
            mouth.parent = characterGroup;

            // === الذراع الأيسر ===
            const armL = BABYLON.MeshBuilder.CreateBox("armL", { width: 0.2, height: 0.7, depth: 0.2 }, scene);
            armL.material = createMat(clothColor);
            armL.position.set(-0.5, 1.45, 0);
            armL.parent = characterGroup;

            // === الذراع الأيمن (الذي سيلوح) ===
            const armR = BABYLON.MeshBuilder.CreateBox("armR", { width: 0.2, height: 0.7, depth: 0.2 }, scene);
            armR.material = createMat(clothColor);
            armR.position.set(0.5, 1.45, 0);
            armR.parent = characterGroup;

            // === اليد اليمنى (كروية) ===
            const handR = BABYLON.MeshBuilder.CreateSphere("handR", { diameter: 0.15 }, scene);
            handR.material = createMat(skinColor);
            handR.position.set(0.5, 1.1, 0);
            handR.parent = characterGroup;

            // === اليد اليسرى ===
            const handL = BABYLON.MeshBuilder.CreateSphere("handL", { diameter: 0.15 }, scene);
            handL.material = createMat(skinColor);
            handL.position.set(-0.5, 1.1, 0);
            handL.parent = characterGroup;

            // === الساقان ===
            const legMat = createMat(pantsColor);
            
            const legL = BABYLON.MeshBuilder.CreateBox("legL", { width: 0.25, height: 0.6, depth: 0.25 }, scene);
            legL.material = legMat;
            legL.position.set(-0.25, 0.5, 0);
            legL.parent = characterGroup;

            const legR = BABYLON.MeshBuilder.CreateBox("legR", { width: 0.25, height: 0.6, depth: 0.25 }, scene);
            legR.material = legMat;
            legR.position.set(0.25, 0.5, 0);
            legR.parent = characterGroup;

            // === الحذاءان ===
            const shoeMat = createMat(shoeColor);
            
            const shoeL = BABYLON.MeshBuilder.CreateBox("shoeL", { width: 0.3, height: 0.1, depth: 0.4 }, scene);
            shoeL.material = shoeMat;
            shoeL.position.set(-0.25, 0.15, 0.05);
            shoeL.parent = characterGroup;

            const shoeR = BABYLON.MeshBuilder.CreateBox("shoeR", { width: 0.3, height: 0.1, depth: 0.4 }, scene);
            shoeR.material = shoeMat;
            shoeR.position.set(0.25, 0.15, 0.05);
            shoeR.parent = characterGroup;

            // === شعر (بسيط) ===
            const hairMat = createMat(new BABYLON.Color3(0.2, 0.15, 0.1));
            const hair = BABYLON.MeshBuilder.CreateBox("hair", { width: 0.5, height: 0.08, depth: 0.35 }, scene);
            hair.material = hairMat;
            hair.position.set(0, 2.32, 0);
            hair.parent = characterGroup;

            // === أنف ===
            const noseMat = createMat(new BABYLON.Color3(0.85, 0.7, 0.55));
            const nose = BABYLON.MeshBuilder.CreateSphere("nose", { diameter: 0.06 }, scene);
            nose.material = noseMat;
            nose.position.set(0, 2.02, 0.35);
            nose.parent = characterGroup;

            // ============================================================
            // 6. منصة دائرية تحت الشخصية
            // ============================================================
            const platformMat = new BABYLON.StandardMaterial("platformMat", scene);
            platformMat.diffuseColor = new BABYLON.Color3(0.08, 0.09, 0.12);
            platformMat.emissiveColor = new BABYLON.Color3(0.03, 0.04, 0.06);
            platformMat.specularColor = new BABYLON.Color3(0, 0, 0);
            platformMat.alpha = 0.5;

            const platform = BABYLON.MeshBuilder.CreateCylinder(
                "platform",
                { height: 0.1, diameter: 1.2, tessellation: 32 },
                scene
            );
            platform.material = platformMat;
            platform.position.y = -0.45;
            platform.parent = characterGroup;

            // ============================================================
            // 7. جسيمات الخلفية
            // ============================================================
            const particleCount = 100;
            const particleSystem = new BABYLON.ParticleSystem("particles", particleCount, scene);
            particleSystem.particleTexture = new BABYLON.Texture(
                "https://www.babylonjs-playground.com/textures/particles/circle.png",
                scene
            );
            particleSystem.emitter = new BABYLON.Vector3(0, 2, 0);
            particleSystem.minEmitBox = new BABYLON.Vector3(-3, 0, -3);
            particleSystem.maxEmitBox = new BABYLON.Vector3(3, 4, 3);
            particleSystem.color1 = new BABYLON.Color4(0.3, 0.8, 0.77, 0.5);
            particleSystem.color2 = new BABYLON.Color4(0.7, 0.9, 0.3, 0.3);
            particleSystem.minSize = 0.02;
            particleSystem.maxSize = 0.06;
            particleSystem.minLifeTime = 2;
            particleSystem.maxLifeTime = 5;
            particleSystem.emitRate = 20;
            particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            particleSystem.gravity = new BABYLON.Vector3(0, -0.01, 0);
            particleSystem.direction1 = new BABYLON.Vector3(-0.5, 0.5, -0.5);
            particleSystem.direction2 = new BABYLON.Vector3(0.5, 1, 0.5);
            particleSystem.start();

            // ============================================================
            // 8. الرسوم المتحركة للشخصية
            // ============================================================
            let animationTime = 0;
            const cycleDuration = 6; // مدة الدورة بالثواني

            // متغيرات لتخزين المراجع الأصلية للذراع
            const armRStartPos = armR.position.clone();
            const armRStartRot = armR.rotation.clone();
            const handRStartPos = handR.position.clone();

            // موقع الشخصية الابتدائي (خارج الشاشة يميناً)
            characterGroup.position.x = 4.5;
            characterGroup.position.y = 0;

            scene.registerBeforeRender(() => {
                animationTime += engine.getDeltaTime() / 1000;
                
                // حساب التقدم في الدورة (0-1)
                const cycle = (animationTime % cycleDuration) / cycleDuration;
                
                // ====== حركة الشخصية ======
                // دخول: من 0 إلى 0.2 (يمين → وسط)
                // وقوف: من 0.2 إلى 0.5 (في المنتصف)
                // خروج: من 0.5 إلى 0.8 (وسط → يسار)
                // انتظار: من 0.8 إلى 1 (خارج الشاشة)
                
                let xPos;
                if (cycle < 0.2) {
                    // الدخول (يمين → وسط)
                    const t = cycle / 0.2;
                    const ease = t * t * (3 - 2 * t); // smoothstep
                    xPos = 4.5 - ease * 4.5;
                } else if (cycle < 0.5) {
                    // الوقوف في المنتصف
                    xPos = 0;
                } else if (cycle < 0.8) {
                    // الخروج (وسط → يسار)
                    const t = (cycle - 0.5) / 0.3;
                    const ease = t * t * (3 - 2 * t);
                    xPos = -ease * 4.5;
                } else {
                    // خارج الشاشة يساراً
                    xPos = -4.5;
                }
                characterGroup.position.x = xPos;

                // ====== حركة الذراع اليمنى (التحية) ======
                let armWave = 0;
                let handWave = 0;
                
                // التحية تحدث فقط عندما يكون الشخص في المنتصف
                if (cycle >= 0.2 && cycle < 0.5) {
                    const t = (cycle - 0.2) / 0.3;
                    armWave = Math.sin(t * Math.PI * 4) * 0.6;
                    handWave = Math.sin(t * Math.PI * 4 + 0.5) * 0.3;
                }
                
                // حركة الذراع (دوران حول محور Z)
                armR.rotation.z = armRStartRot.z + armWave;
                armR.rotation.x = armRStartRot.x + armWave * 0.3;
                
                // حركة اليد
                handR.position.x = handRStartPos.x + armWave * 0.1;
                handR.position.y = handRStartPos.y + armWave * 0.1;

                // ====== حركة الرأس (ينظر ناحية اليد) ======
                if (cycle >= 0.2 && cycle < 0.5) {
                    const t = (cycle - 0.2) / 0.3;
                    head.rotation.z = Math.sin(t * Math.PI * 3) * 0.08;
                    head.rotation.y = Math.sin(t * Math.PI * 3) * 0.05;
                } else {
                    head.rotation.z *= 0.95;
                    head.rotation.y *= 0.95;
                }

                // ====== حركة الجسم (تمايل خفيف) ======
                if (cycle >= 0.2 && cycle < 0.5) {
                    const t = (cycle - 0.2) / 0.3;
                    body.rotation.z = Math.sin(t * Math.PI * 2) * 0.02;
                } else {
                    body.rotation.z *= 0.95;
                }

                // ====== دوران المنصة ======
                platform.rotation.y += 0.005;

                // ====== إضافة وهج عند الوقوف ======
                if (cycle >= 0.2 && cycle < 0.5) {
                    const t = (cycle - 0.2) / 0.3;
                    const glow = 0.3 + t * 0.2;
                    platformMat.emissiveColor = new BABYLON.Color3(0.05 * glow, 0.08 * glow, 0.12 * glow);
                } else {
                    platformMat.emissiveColor = new BABYLON.Color3(0.03, 0.04, 0.06);
                }
            });

            // ============================================================
            // 9. إعادة الحجم عند تغيير النافذة
            // ============================================================
            window.addEventListener('resize', function() {
                engine.resize();
            });

            // ============================================================
            // 10. بدء التصيير
            // ============================================================
            engine.runRenderLoop(function() {
                scene.render();
            });

        })();
    </script>
</body>
</html>
