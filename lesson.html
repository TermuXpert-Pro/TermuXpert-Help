<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpert - الدرس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
    <div class="bg-grid"></div>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">X</div>
            <div class="nav-logo-text"><span>X</span>pert</div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a></li>
            <li><a href="subjects.html"><i class="fa-solid fa-book"></i> المواد</a></li>
        </ul>
    </nav>
    <div class="hero" style="min-height:auto; padding:100px 20px 40px;">
        <h1 style="font-size:32px;" id="lessonTitle">الدرس</h1>
        <p class="description" id="lessonSubtitle">محتوى شامل مع أمثلة وتمارين</p>
    </div>
    <div style="max-width:800px; margin:0 auto; padding:0 20px 60px;">
        <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة</a>
        <div id="lessonContent"><div class="no-data">جاري التحميل...</div></div>
    </div>
    <footer class="footer"><div class="divider"></div><p>Xpert &copy; 2026 - 1 Bac Sciences Expérimentales</p></footer>
    <script>
        // بيانات الدروس الكاملة
        const lessonsData = {
            math: [
                { title: "Généralités sur les fonctions", content: `
                    <h3 style="color:#4ECDC4;">Définition</h3>
                    <p>Une fonction numérique $f$ est une relation qui associe à chaque élément $x$ de $\\mathbb{R}$ au plus un élément $y$ de $\\mathbb{R}$.</p>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$f : \\mathbb{R} \\to \\mathbb{R}$$ $$x \\mapsto f(x)$$</div>
                    </div>
                    <h3 style="color:#FF6B6B; margin-top:20px;">Fonction paire</h3>
                    <p>$f$ est paire sur $D_f$ ssi :</p>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$\\begin{cases} \\forall x \\in D_f, -x \\in D_f \\\\ \\forall x \\in D_f, f(-x) = f(x) \\end{cases}$$</div>
                    </div>
                `},
                { title: "Logique mathématique", content: `
                    <h3 style="color:#4ECDC4;">Proposition</h3>
                    <p>Une proposition est une phrase soit vraie, soit fausse.</p>
                    <h3 style="color:#FF6B6B; margin-top:20px;">Opérateurs logiques</h3>
                    <p>$\\land$ : et, $\\lor$ : ou, $\\neg$ : non, $\\Rightarrow$ : implique, $\\Leftrightarrow$ : équivaut</p>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$\\forall x \\in \\mathbb{R}, x^2 \\ge 0$$</div>
                    </div>
                `},
                { title: "Raisonnement par récurrence", content: `
                    <h3 style="color:#4ECDC4;">Principe</h3>
                    <p>Pour montrer que $P(n)$ est vraie pour tout $n \\in \\mathbb{N}$ :</p>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$P(0) \\text{ vraie}$$ $$P(n) \\Rightarrow P(n+1)$$</div>
                    </div>
                `},
                { title: "Les suites numériques", content: `
                    <h3 style="color:#4ECDC4;">Définition</h3>
                    <p>Une suite $(u_n)$ est une fonction de $\\mathbb{N}$ vers $\\mathbb{R}$.</p>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$u_{n+1} = f(u_n)$$</div>
                    </div>
                `},
                { title: "Fonctions trigonométriques", content: `
                    <h3 style="color:#4ECDC4;">Identités fondamentales</h3>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$\\sin^2 x + \\cos^2 x = 1$$ $$\\sin(a+b) = \\sin a \\cos b + \\cos a \\sin b$$</div>
                    </div>
                `}
            ],
            physique: [
                { title: "Mouvement rectiligne", content: `
                    <h3 style="color:#4ECDC4;">Position</h3>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$x(t) = x_0 + v_0 t + \\frac{1}{2} a t^2$$</div>
                    </div>
                    <h3 style="color:#FF6B6B; margin-top:20px;">Vitesse</h3>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$v(t) = v_0 + a t$$</div>
                    </div>
                `},
                { title: "Lois de Newton", content: `
                    <h3 style="color:#4ECDC4;">Deuxième loi</h3>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$\\sum \\vec{F} = m \\vec{a}$$</div>
                    </div>
                `}
            ],
            chimie: [
                { title: "Structure de l'atome", content: `
                    <h3 style="color:#4ECDC4;">Représentation</h3>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$\\ce{^{A}_{Z}X}$$</div>
                    </div>
                `},
                { title: "Réactions chimiques", content: `
                    <h3 style="color:#4ECDC4;">Équation bilan</h3>
                    <div class="code-block" style="padding:16px; background:#0D1117; text-align:center; margin:12px 0;">
                        <div class="code-content" style="font-size:18px;">$$\\ce{2H2 + O2 -> 2H2O}$$</div>
                    </div>
                `}
            ]
        };

        function loadLesson() {
            const params = new URLSearchParams(window.location.search);
            const subjectId = params.get('subject');
            const lessonIndex = parseInt(params.get('lesson'));
            
            const lessons = lessonsData[subjectId];
            if (!lessons || !lessons[lessonIndex]) {
                document.getElementById('lessonTitle').textContent = '⚠️ الدرس غير موجود';
                document.getElementById('lessonContent').innerHTML = '<div class="no-data">الدرس غير موجود</div>';
                return;
            }
            
            const lesson = lessons[lessonIndex];
            document.getElementById('lessonTitle').textContent = lesson.title;
            document.getElementById('lessonContent').innerHTML = lesson.content;
            
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        loadLesson();
    </script>
</body>
</html>
