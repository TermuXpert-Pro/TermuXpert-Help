<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Xpert",
        "description": "Cours de 1 Bac Sciences Expérimentales"
    }
    
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partie 5 - Généralités sur les fonctions | Xpert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../../../assets/css/style.css">
    <link rel="stylesheet" href="../../../../assets/css/lesson-common.css">
    <link rel="stylesheet" href="../../../../assets/css/global-control.css">
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer loading="lazy"></script>
    <style>
        @media (max-width: 480px) { 
            body { font-size: 13px; } 
            .lesson-title { font-size: 15px; } 
            .section h2 { font-size: 13px; } 
            .section h3 { font-size: 10.5px; } 
            .section p { font-size: 13px; } 
            .formula-block { font-size: 13px; padding: 4px 6px; } 
            .table-wrap th, .table-wrap td { padding: 2px 4px; font-size: 9px; } 
            .step { font-size: 13px; padding: 2px 8px; } 
            .back-btn { font-size: 13px; padding: 3px 10px; } 
            .nav-logo-icon { width: 20px; height: 20px; font-size: 13px; } 
        }
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }
        .lesson-title {
            color: #4ECDC4;
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }
        .highlight-box {
            background: rgba(69, 162, 158, 0.08);
            border-right: 4px solid var(--accent);
            padding: 14px 18px;
            border-radius: 8px;
            margin: 12px 0;
        }
        .highlight-box.green { border-color: #4ECDC4; background: rgba(78, 205, 196, 0.08); }
        .highlight-box.red { border-color: #FF6B6B; background: rgba(255, 107, 107, 0.08); }
        .highlight-box.yellow { border-color: #F4D03F; background: rgba(244, 208, 63, 0.08); }
        .highlight-box.purple { border-color: #BB8FCE; background: rgba(187, 143, 206, 0.08); }
        .highlight-box .label {
            display: inline-block;
            font-weight: 700;
            font-size: 13px;
            padding: 2px 12px;
            border-radius: 20px;
            margin-bottom: 6px;
        }
        .highlight-box .label.def { background: #4ECDC422; color: #4ECDC4; }
        .highlight-box .label.prop { background: #FF6B6B22; color: #FF6B6B; }
        .highlight-box .label.ex { background: #F4D03F22; color: #F4D03F; }
        .highlight-box .label.rem { background: #BB8FCE22; color: #BB8FCE; }
        .highlight-box .label.rappel { background: #F4D03F44; color: #F4D03F; }
        .highlight-box .label.resume { background: #4ECDC444; color: #4ECDC4; }
        .highlight-box strong { color: var(--text-primary); }
        .step {
            background: var(--bg-primary);
            border-left: 3px solid #4ECDC4;
            padding: 8px 14px;
            margin: 6px 0;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .step .step-num {
            color: #4ECDC4;
            font-weight: 700;
            margin-left: 6px;
        }
        .table-wrap {
            overflow-x: auto;
            margin: 12px 0;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-primary);
            border-radius: 10px;
            overflow: hidden;
        }
        .table-wrap th {
            background: var(--bg-card);
            color: var(--accent-light);
            padding: 10px 14px;
            border: 1px solid var(--border);
            font-weight: 700;
            text-align: center;
        }
        .table-wrap td {
            padding: 10px 14px;
            border: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
        }
        .table-wrap .true { color: #4ECDC4; font-weight: 700; }
        .table-wrap .false { color: #FF6B6B; font-weight: 700; }
        .formula-block {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 12px 0;
            text-align: center;
            overflow-x: auto;
            font-size: 18px;
        }
        .formula-block .math {
            color: var(--accent-light);
            font-family: var(--font-mono);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .back-btn:hover { background: rgba(69, 162, 158, 0.1); }
        .next-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--bg-primary);
            background: var(--gradient);
            text-decoration: none;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 15px;
            float: right;
        }
        .next-btn:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(69, 162, 158, 0.3);
        }
        .exercice-box .ex-title {
            color: #E8873A;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .exercice-box .ex-question {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
        }
        .solution-box {
            background: #1A2A1A;
            border: 1px solid #A8FF7844;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 8px 0;
            display: none;
        }
        .solution-box.show {
            display: block;
        }
        .solution-box .sol-title {
            color: #A8FF78;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .toggle-sol:hover {
            border-color: #4ECDC4;
            background: rgba(78, 205, 196, 0.1);
        }
        .sub-section {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 16px;
        }
        @media (max-width: 600px) {

        function toggleSolution(id) {
            var el = document.getElementById(id);
            var btn = el.previousElementSibling;
            if (el.classList.contains('show')) {
                el.classList.remove('show');
                btn.textContent = 'Voir la solution';
            } else {
                el.classList.add('show');
                btn.textContent = 'Cacher la solution';
            }
        }
    <script>
        });
</body>
</html>
