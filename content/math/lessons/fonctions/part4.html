        // ============================================================
        // GRAPHIQUES
        // ============================================================

        function drawCubeUp() {
            var canvas = document.getElementById('cubeUpGraph');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var w = canvas.width, h = canvas.height;
            var cx = w/2, cy = h/2;
            var scale = 25;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#0D1117';
            ctx.fillRect(0, 0, w, h);

            // Axes
            ctx.strokeStyle = '#2A2A3E';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

            ctx.fillStyle = '#4ECDC4';
            ctx.font = '10px Arial';
            ctx.fillText('x', w-12, cy+14);
            ctx.fillText('y', cx+6, 10);

            // Cube f(x) = x³
            ctx.strokeStyle = '#4ECDC4';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (var px = 0; px <= w; px += 0.5) {
                var x = (px - cx) / scale;
                var y = x * x * x;
                var screenX = cx + x * scale;
                var screenY = cy - y * scale;
                if (screenY < -50 || screenY > h + 50) { continue; }
                if (px === 0) ctx.moveTo(screenX, screenY);
                else ctx.lineTo(screenX, screenY);
            }
            ctx.stroke();
        }

        function drawCubeDown() {
            var canvas = document.getElementById('cubeDownGraph');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var w = canvas.width, h = canvas.height;
            var cx = w/2, cy = h/2;
            var scale = 25;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#0D1117';
            ctx.fillRect(0, 0, w, h);

            // Axes
            ctx.strokeStyle = '#2A2A3E';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

            ctx.fillStyle = '#FF6B6B';
            ctx.font = '10px Arial';
            ctx.fillText('x', w-12, cy+14);
            ctx.fillText('y', cx+6, 10);

            // Cube f(x) = -x³
            ctx.strokeStyle = '#FF6B6B';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (var px = 0; px <= w; px += 0.5) {
                var x = (px - cx) / scale;
                var y = -x * x * x;
                var screenX = cx + x * scale;
                var screenY = cy - y * scale;
                if (screenY < -50 || screenY > h + 50) { continue; }
                if (px === 0) ctx.moveTo(screenX, screenY);
                else ctx.lineTo(screenX, screenY);
            }
            ctx.stroke();
        }

        function drawSqrt() {
            var canvas = document.getElementById('sqrtGraph');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var w = canvas.width, h = canvas.height;
            var cx = 40, cy = h - 40;
            var scale = 35;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#0D1117';
            ctx.fillRect(0, 0, w, h);

            // Grille
            ctx.strokeStyle = '#1A1A2E';
            ctx.lineWidth = 0.5;
            for (var i = 0; i <= 10; i++) {
                if (i === 0) continue;
                ctx.beginPath();
                ctx.moveTo(cx + i * scale, 0);
                ctx.lineTo(cx + i * scale, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, cy - i * scale);
                ctx.lineTo(w, cy - i * scale);
                ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#2A2A3E';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

            // Flèches
            ctx.fillStyle = '#4ECDC4';
            ctx.beginPath(); ctx.moveTo(w-12, cy-5); ctx.lineTo(w, cy); ctx.lineTo(w-12, cy+5); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx-5, 12); ctx.lineTo(cx, 0); ctx.lineTo(cx+5, 12); ctx.fill();

            // Labels
            ctx.fillStyle = '#4ECDC4';
            ctx.font = '14px Arial';
            ctx.fillText('x', w-16, cy+18);
            ctx.fillText('y', cx+10, 16);

            // Courbe f(x) = √x
            ctx.strokeStyle = '#4ECDC4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (var px = cx; px <= w; px += 0.5) {
                var x = (px - cx) / scale;
                if (x < 0) continue;
                var y = Math.sqrt(x);
                var screenX = cx + x * scale;
                var screenY = cy - y * scale;
                if (screenY < -50 || screenY > h + 50) { continue; }
                if (px === cx) ctx.moveTo(screenX, screenY);
                else ctx.lineTo(screenX, screenY);
            }
            ctx.stroke();
            ctx.fillStyle = '#4ECDC4';
            ctx.font = '14px Arial';
            ctx.fillText('f(x) = √x', w - 100, 20);
        }

        window.onload = function() {
            setTimeout(function() {
                drawCubeUp();
                drawCubeDown();
                drawSqrt();
