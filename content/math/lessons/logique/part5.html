        .badge-part {
            display: inline-block;

        .highlight-box .label {

        .highlight-box .label.def { background: #4ECDC422; color: #4ECDC4; }

        .highlight-box .label.rem { background: #BB8FCE22; color: #BB8FCE; }
        .highlight-box .label.resume { background: #4ECDC444; color: #4ECDC4; }
        .highlight-box .label.prop { background: #FF6B6B22; color: #FF6B6B; }
        .highlight-box .label.rappel { background: #F4D03F44; color: #F4D03F; }
        .highlight-box .label.summary { background: #F4D03F44; color: #F4D03F; font-size: 14px; }
        .highlight-box.green { border-color: #4ECDC4; background: rgba(78, 205, 196, 0.08); }
        .highlight-box.red { border-color: #FF6B6B; background: rgba(255, 107, 107, 0.08); }
        .highlight-box.yellow { border-color: #F4D03F; background: rgba(244, 208, 63, 0.08); }

        .highlight-box.gold { border-color: #F4D03F; background: rgba(244, 208, 63, 0.12); }
        .table-wrap { overflow-x: auto; margin: 6px 0; }
        .table-wrap table { width: 100%; border-collapse: collapse; background: var(--bg-primary); border-radius: 8px; overflow: hidden; max-width: 400px; margin: 0 auto; }
        .table-wrap th { background: var(--bg-card); color: var(--accent-light); padding: 6px 12px; border: 1px solid var(--border); font-weight: 700; text-align: center; font-size: 13px; }
        .table-wrap td { padding: 6px 12px; border: 1px solid var(--border); text-align: center; color: var(--text-secondary); font-size: 13px; }
        .table-wrap .true { color: #4ECDC4; font-weight: 700; }
        .table-wrap .false { color: #FF6B6B; font-weight: 700; }
        .formula-block { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 6px 0; text-align: center; overflow-x: auto; font-size: 15px; }
        .formula-block .math { color: var(--accent-light); font-family: var(--font-mono); }
        .section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; }
        .section h2 { color: #F4D03F; font-size: 18px; font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .section h2 .num { background: var(--gradient); color: var(--bg-primary); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; flex-shrink: 0; }
        .section h3 { color: #66FCF1; font-size: 15px; font-weight: 700; margin: 10px 0 6px; }
        .section h4 { color: #FF6B6B; font-size: 14px; font-weight: 700; margin: 8px 0 4px; }
        .section p { color: var(--text-secondary); font-size: 13px; line-height: 1.7; margin-bottom: 4px; }
        .section ul { color: var(--text-secondary); font-size: 13px; line-height: 1.7; padding-right: 18px; margin-bottom: 4px; }
        .section ul li { margin-bottom: 3px; }
        .step { background: var(--bg-primary); border-right: 3px solid #F4D03F; padding: 4px 12px; margin: 3px 0; border-radius: 4px; color: var(--text-secondary); font-size: 13px; }
        .step .step-num { color: #F4D03F; font-weight: 700; margin-left: 6px; font-size: 13px; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
        .nav-buttons .next-btn, .nav-buttons .prev-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--bg-primary); background: var(--gradient); text-decoration: none; font-weight: 700; padding: 6px 16px; border-radius: 8px; transition: all 0.3s ease; font-size: 13px; border: none; }
        .nav-buttons .next-btn:hover { transform: translateX(4px); box-shadow: 0 4px 20px rgba(69, 162, 158, 0.3); }
        .nav-buttons .prev-btn:hover { transform: translateX(-4px); box-shadow: 0 4px 20px rgba(69, 162, 158, 0.3); }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-light); text-decoration: none; font-weight: 600; padding: 5px 14px; border-radius: 8px; transition: all 0.2s ease; margin-bottom: 14px; font-size: 13px; }
        .back-btn:hover { background: rgba(69, 162, 158, 0.1); }
        .lesson-title { color: #F4D03F; font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 14px; border-bottom: 2px solid #F4D03F44; padding-bottom: 10px; }
        .sub-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
        .greek-table { max-width: 500px; margin: 0 auto; }
        .greek-table td { padding: 4px 10px; font-size: 14px; }
        .greek-table .greek { font-family: 'Times New Roman', serif; font-size: 18px; color: #4ECDC4; }
        .summary-card { background: rgba(244, 208, 63, 0.03); border: 1px solid #F4D03F22; border-radius: 10px; padding: 12px 16px; margin: 6px 0; }
        @media (max-width: 768px) {
            .section { padding: 10px 12px; }
            .section h2 { font-size: 16px; }
            .section h3 { font-size: 14px; }
            .section p { font-size: 12px; }
            .section ul { font-size: 12px; }
            .formula-block { font-size: 13px; padding: 8px 10px; }
            .table-wrap table { max-width: 100%; font-size: 12px; }
            .table-wrap th, .table-wrap td { padding: 4px 8px; font-size: 12px; }
            .lesson-title { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .section { padding: 8px 10px; }
            .section h2 { font-size: 14px; }
            .section h3 { font-size: 13px; }
            .section p { font-size: 11px; }
            .section ul { font-size: 11px; }
            .formula-block { font-size: 12px; padding: 6px 8px; }
            .table-wrap th, .table-wrap td { padding: 3px 6px; font-size: 11px; }
            .lesson-title { font-size: 17px; }
            .step { font-size: 12px; padding: 3px 8px; }
            .step .step-num { font-size: 12px; }
            .greek-table td { font-size: 12px; }
            .greek-table .greek { font-size: 15px; }
        }
