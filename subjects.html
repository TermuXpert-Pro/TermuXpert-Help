<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpert - Matières</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        .moroccan-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
        }
        .moroccan-bg svg { width: 100%; height: 100%; }

        .moroccan-shadow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at center, #4ECDC4 0%, #FF6B6B 40%, #F4D03F 70%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            animation: shadowPulse 8s ease-in-out infinite;
        }
        @keyframes shadowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.08; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.15; }
        }

        .moroccan-star {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            font-size: 120px;
            color: #4ECDC4;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: starSpin 20s linear infinite;
        }
        @keyframes starSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        .geo-pattern {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            color: #F4D03F;
            font-size: 20px;
            letter-spacing: 20px;
        }
        .geo-pattern-1 { top: 10%; left: 5%; transform: rotate(-15deg); }
        .geo-pattern-2 { bottom: 10%; right: 5%; transform: rotate(15deg); }
        .geo-pattern-3 { top: 50%; left: 2%; transform: rotate(90deg); }
        .geo-pattern-4 { top: 50%; right: 2%; transform: rotate(-90deg); }

        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: clamp(80px, 15vh, 120px) var(--container-padding) clamp(30px, 4vh, 50px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            min-height: 50vh;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(0) scale(0.95);
        }
        .hero h1 .gradient-text {
            background: linear-gradient(135deg, #4ECDC4, #66FCF1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .description {
            color: var(--text-muted);
            font-size: clamp(14px, 1.8vw, 18px);
            max-width: 550px;
            margin: 0 auto;
            line-height: 1.8;
            opacity: 0;
            transform: translateY(20px);
        }

        .grid-container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 50px;
            opacity: 0;
            transform: translateY(60px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
            gap: clamp(16px, 2vw, 24px);
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: clamp(20px, 2.5vw, 30px) clamp(16px, 2vw, 24px);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            text-align: center;
            opacity: 0;
            transform: translateY(80px);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.03), rgba(255, 107, 107, 0.03));
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .card:hover::before {
            opacity: 1;
        }
        .card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(78, 205, 196, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .card:active {
            transform: scale(0.97);
        }

        .card .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
            transition: transform 0.3s ease;
        }
        .card:hover .card-icon {
            transform: scale(1.1);
        }
        .card h3 {
            font-size: clamp(18px, 2vw, 22px);
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card p {
            color: var(--text-secondary);
            font-size: clamp(12px, 1.2vw, 14px);
            line-height: 1.6;
            margin-bottom: 12px;
            opacity: 0.8;
        }
        .card .card-badges {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: clamp(11px, 1.1vw, 12px);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        .card .badge:active {
            opacity: 0.7;
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .moroccan-shadow { width: 300px; height: 300px; }
            .moroccan-star { font-size: 60px; }
            .geo-pattern { font-size: 14px; letter-spacing: 12px; }
            .hero { padding: 100px 20px 30px; min-height: 40vh; }
            .card { padding: 16px 14px; }
        }
        @media (max-width: 480px) {
            .moroccan-shadow { width: 200px; height: 200px; }
            .moroccan-star { font-size: 40px; }
            .geo-pattern { font-size: 13px; letter-spacing: 8px; }
            .hero h1 { font-size: 24px; }
            .hero .description { font-size: 13px; }
            .card { padding: 14px 10px; }
            .card .card-icon { width: 48px; height: 48px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="moroccan-bg">
        <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="zellij" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
                    <rect width="200" height="200" fill="none"/>
                    <polygon points="100,0 200,100 100,200 0,100" fill="none" stroke="#4ECDC4" stroke-width="0.5" opacity="0.3"/>
                    <polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="#66FCF1" stroke-width="0.5" opacity="0.2"/>
                    <polygon points="100,40 160,100 100,160 40,100" fill="none" stroke="#F4D03F" stroke-width="0.5" opacity="0.2"/>
                    <polygon points="100,60 140,100 100,140 60,100" fill="none" stroke="#FF6B6B" stroke-width="0.5" opacity="0.2"/>
                    <text x="100" y="100" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#F4D03F" opacity="0.2">✦</text>
                    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <text x="150" y="50" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <text x="50" y="150" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <line x1="0" y1="0" x2="200" y2="200" stroke="#4ECDC4" stroke-width="0.3" opacity="0.1"/>
                    <line x1="200" y1="0" x2="0" y2="200" stroke="#4ECDC4" stroke-width="0.3" opacity="0.1"/>
                    <line x1="100" y1="0" x2="100" y2="200" stroke="#4ECDC4" stroke-width="0.3" opacity="0.05"/>
                    <line x1="0" y1="100" x2="200" y2="100" stroke="#4ECDC4" stroke-width="0.3" opacity="0.05"/>
                </pattern>
            </defs>
            <rect width="800" height="800" fill="url(#zellij)"/>
        </svg>
    </div>

    <div class="moroccan-shadow"></div>
    <div class="moroccan-star">✦</div>

    <div class="geo-pattern geo-pattern-1">✦ ✧ ✦ ✧ ✦</div>
    <div class="geo-pattern geo-pattern-2">✦ ✧ ✦ ✧ ✦</div>
    <div class="geo-pattern geo-pattern-3">✦ ✧ ✦ ✧ ✦</div>
    <div class="geo-pattern geo-pattern-4">✦ ✧ ✦ ✧ ✦</div>

    <div class="progress-bar" id="progressBar"></div>
    <div class="bg-grid"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">X</div>
            <div class="nav-logo-text"><span>X</span>pert</div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-house"></i> Accueil</a></li>
        </ul>
    </nav>

    <section class="hero" id="heroSection">
        <h1 id="title">Mathématiques, <span class="gradient-text">Physique</span> et Chimie</h1>
        <p class="description" id="desc">Choisissez votre matière pour découvrir tout son contenu</p>
    </section>

    <div class="grid-container" id="gridContainer">
        <div class="grid" id="subjectsGrid">
            <div class="no-data">Chargement...</div>
        </div>
    </div>

    <footer class="footer">
        <div class="divider"></div>
        <p>Xpert &copy; 2026 - 1 Bac Sciences Expérimentales</p>
    </footer>

    <button class="scroll-top-btn" aria-label="Retour en haut">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
    <script>
        const subjects = [

            { 

                id: "math", 

                title: "Mathématiques", 

                description: "Fonctions, géométrie, algèbre, probabilités, suites",

                icon: "fa-square-root-variable", 

                color: "#4ECDC4",

                bgColor: "rgba(78, 205, 196, 0.12)",

                lessons: 8,

                exercises: 15

            },

            { 

                id: "physique", 

                title: "Physique", 

                description: "Mécanique, électricité, ondes, énergie, thermique",

                icon: "fa-atom", 

                color: "#FF6B6B",

                bgColor: "rgba(255, 107, 107, 0.12)",

                lessons: 6,

                exercises: 12

            },

            { 

                id: "chimie", 

                title: "Chimie", 

                description: "Atome, réactions, acides et bases, oxydoréduction",

                icon: "fa-flask", 

                color: "#F4D03F",

                bgColor: "rgba(244, 208, 63, 0.12)",

                lessons: 5,

                exercises: 10

            }

        ];

        function renderSubjects() {
            const grid = document.getElementById('subjectsGrid');
            
            grid.innerHTML = subjects.map((s, index) => `
                <div class="card" data-index="${index}" onclick="location.href='subject.html?subject=${s.id}'" style="border-color: ${s.color}33;">
                    <div class="card-icon" style="background:${s.bgColor}; color:${s.color};">
                        <i class="fas ${s.icon}"></i>
                    </div>
                    <h3 style="color:${s.color};">${s.title}</h3>
                    <p>${s.description}</p>
                    <div class="card-badges">
                        <span class="badge" style="background:${s.bgColor}; color:${s.color}; border-color: ${s.color}22;">
                            <i class="fas fa-book"></i> ${s.lessons} cours
                        </span>
                        <span class="badge" style="background:${s.bgColor}; color:${s.color}; border-color: ${s.color}22;">
                            <i class="fas fa-list-check"></i> ${s.exercises} exercices
                        </span>
                    </div>
                </div>
            `).join('');
        }

        renderSubjects();

        document.addEventListener('DOMContentLoaded', function() {
            
            const tl = gsap.timeline({
                defaults: {
                    ease: 'power2.out'
                }
            });

            tl
                .to('.moroccan-bg', {
                    opacity: 0.6,
                    duration: 1.0,
                    ease: 'power1.out'
                })
                .to('.moroccan-shadow', {
                    opacity: 0.08,
                    duration: 1.0,
                    ease: 'power1.out'
                }, '-=0.8')
                .to('.moroccan-star', {
                    opacity: 0.04,
                    duration: 1.0,
                    ease: 'power1.out'
                }, '-=0.8')
                .to('.geo-pattern', {
                    opacity: 0.03,
                    duration: 1.0,
                    stagger: 0.08,
                    ease: 'power1.out'
                }, '-=0.8')
                .to('#heroSection', {
                    opacity: 1,
                    duration: 0.8,
                    ease: 'power2.out'
                }, '-=0.5')
                .to('#title', {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: 'power3.out'
                }, '-=0.3')
                .to('#desc', {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: 'power3.out'
                }, '-=0.3')
                .to('#gridContainer', {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: 'power3.out'
                }, '-=0.3')
                .to('.card', {
                    opacity: 1,
                    y: 0,
                    duration: 0.6,
                    stagger: 0.12,
                    ease: 'back.out(1.4)'
                }, '-=0.4');

            gsap.to('.moroccan-bg', {
                opacity: 0.8,
                duration: 4,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            gsap.to('.moroccan-star', {
                rotation: 360,
                duration: 30,
                repeat: -1,
                ease: 'none'
            });

            gsap.to('.geo-pattern-1', {
                x: 25,
                y: 12,
                duration: 5,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });
            gsap.to('.geo-pattern-2', {
                x: -25,
                y: -12,
                duration: 5,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 1.2
            });
            gsap.to('.geo-pattern-3', {
                x: 18,
                y: -18,
                duration: 6,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 0.6
            });
            gsap.to('.geo-pattern-4', {
                x: -18,
                y: 18,
                duration: 6,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 1.8
            });

            document.querySelectorAll('.card').forEach(card => {
                card.addEventListener('mouseenter', () => {
                    gsap.to(card, {
                        scale: 1.02,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                });
                card.addEventListener('mouseleave', () => {
                    gsap.to(card, {
                        scale: 1,
                        duration: 0.3,
                        ease: 'power2.inOut'
                    });
                });
            });

            console.log('✅ GSAP - Page matériaux');
        });
    </script>
</body>
</html>
