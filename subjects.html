<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpert - Matières</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ====== شريط تقدم القراءة ====== -->
    <div class="progress-bar" id="progressBar"></div>

    <div class="bg-grid"></div>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">X</div>
            <div class="nav-logo-text"><span>X</span>pert</div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-house"></i> Accueil</a></li>
        </ul>
    </nav>
    
    <div class="hero" style="min-height:auto; padding:60px 20px 30px;">
        <h1 style="font-size:28px;">Mathématiques, <span class="gradient-text">Physique</span> et Chimie</h1>
        <p class="description" style="font-size:14px;">Choisissez votre matière pour découvrir tout son contenu</p>
    </div>
    
    <div style="max-width:1100px; margin:0 auto; padding:0 20px 40px;">
        <div class="grid" id="subjectsGrid">
            <div class="no-data">Chargement...</div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="divider"></div>
        <p>Xpert &copy; 2026 - 1 Bac Sciences Expérimentales</p>
    </footer>

    <!-- ====== زر العودة للأعلى ====== -->
    <button class="scroll-top-btn" aria-label="Retour en haut">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
    <script>
        const subjects = [
            { 
                id: "math", 
                title: "Mathématiques", 
                description: "Fonctions, géométrie, algèbre, probabilités, suites",
                icon: "fa-square-root-variable", 
                color: "#4ECDC4",
                bgColor: "#4ECDC422",
                lessons: 8,
                exercises: 15
            },
            { 
                id: "physique", 
                title: "Physique", 
                description: "Mécanique, électricité, ondes, énergie, thermique",
                icon: "fa-atom", 
                color: "#FF6B6B",
                bgColor: "#FF6B6B22",
                lessons: 6,
                exercises: 12
            },
            { 
                id: "chimie", 
                title: "Chimie", 
                description: "Atome, réactions, acides et bases, oxydoréduction",
                icon: "fa-flask", 
                color: "#F4D03F",
                bgColor: "#F4D03F22",
                lessons: 5,
                exercises: 10
            }
        ];

        function renderSubjects() {
            const grid = document.getElementById('subjectsGrid');
            
            grid.innerHTML = subjects.map(s => `
                <div class="card" onclick="location.href='subject.html?subject=${s.id}'" style="border-right-color: ${s.color};">
                    <div class="card-icon" style="background:${s.bgColor}; color:${s.color};">
                        <i class="fas ${s.icon}"></i>
                    </div>
                    <h3 style="color:${s.color};">${s.title}</h3>
                    <p>${s.description}</p>
                    <div class="card-badges">
                        <span class="badge" style="background:${s.bgColor}; color:${s.color};">
                            <i class="fas fa-book"></i> ${s.lessons} cours
                        </span>
                        <span class="badge" style="background:${s.bgColor}; color:${s.color};">
                            <i class="fas fa-list-check"></i> ${s.exercises} exercices
                        </span>
                    </div>
                </div>
            `).join('');
        }

        renderSubjects();
    </script>
</body>
</html>
