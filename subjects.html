<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpert - Matières</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-grid"></div>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">X</div>
            <div class="nav-logo-text"><span>X</span>pert</div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-house"></i> Accueil</a></li>
        </ul>
    </nav>
    
    <div class="hero" style="min-height:auto; padding:100px 20px 50px;">
        <h1 style="font-size:40px;">Matières <span class="gradient-text">scolaires</span></h1>
        <p class="description">Choisissez votre matière pour découvrir tout son contenu</p>
    </div>
    
    <div style="max-width:1100px; margin:0 auto; padding:0 20px 60px;">
        <!-- Barre de recherche -->
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Rechercher une matière..." oninput="filterSubjects()">
        </div>
        
        <div class="grid" id="subjectsGrid">
            <div class="no-data">Chargement...</div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="divider"></div>
        <p>Xpert &copy; 2026 - 1 Bac Sciences Expérimentales</p>
    </footer>
    
    <script>
        const subjects = [
            { 
                id: "math", 
                title: "Mathématiques", 
                description: "Fonctions, géométrie, algèbre, probabilités, suites",
                icon: "fa-square-root-variable", 
                color: "#4ECDC4",
                bgColor: "#4ECDC422",
                lessons: 8,
                exercises: 15
            },
            { 
                id: "physique", 
                title: "Physique", 
                description: "Mécanique, électricité, ondes, énergie, thermique",
                icon: "fa-atom", 
                color: "#FF6B6B",
                bgColor: "#FF6B6B22",
                lessons: 6,
                exercises: 12
            },
            { 
                id: "chimie", 
                title: "Chimie", 
                description: "Atome, réactions, acides et bases, oxydoréduction",
                icon: "fa-flask", 
                color: "#F4D03F",
                bgColor: "#F4D03F22",
                lessons: 5,
                exercises: 10
            }
        ];

        function renderSubjects(filtered) {
            const grid = document.getElementById('subjectsGrid');
            const data = filtered || subjects;
            
            if (data.length === 0) {
                grid.innerHTML = '<div class="no-data"><i class="fas fa-search" style="font-size:32px; display:block; margin-bottom:12px; color:var(--text-muted);"></i>Aucune matière trouvée</div>';
                return;
            }
            
            grid.innerHTML = data.map(s => `
                <div class="card" onclick="location.href='subject.html?subject=${s.id}'" style="border-right-color: ${s.color};">
                    <div class="card-icon" style="background:${s.bgColor}; color:${s.color};">
                        <i class="fas ${s.icon}"></i>
                    </div>
                    <h3 style="color:${s.color};">${s.title}</h3>
                    <p>${s.description}</p>
                    <div class="card-badges">
                        <span class="badge" style="background:${s.bgColor}; color:${s.color};">
                            <i class="fas fa-book"></i> ${s.lessons} cours
                        </span>
                        <span class="badge" style="background:${s.bgColor}; color:${s.color};">
                            <i class="fas fa-list-check"></i> ${s.exercises} exercices
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function filterSubjects() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) { renderSubjects(); return; }
            const filtered = subjects.filter(s => 
                s.title.toLowerCase().includes(q) || 
                s.description.toLowerCase().includes(q)
            );
            renderSubjects(filtered);
        }

        renderSubjects();
    </script>
</body>
</html>
