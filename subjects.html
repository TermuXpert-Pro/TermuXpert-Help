<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpert - المواد الدراسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-grid"></div>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">X</div>
            <div class="nav-logo-text"><span>X</span>pert</div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a></li>
        </ul>
    </nav>
    <div class="hero" style="min-height:auto; padding:100px 20px 50px;">
        <h1 style="font-size:40px;">المواد <span class="gradient-text">الدراسية</span></h1>
        <p class="description">اختر مادتك لتكتشف كل المحتويات</p>
    </div>
    <div style="max-width:1100px; margin:0 auto; padding:0 20px 60px;">
        <div class="search-box"><input type="text" id="searchInput" placeholder="ابحث عن مادة..." oninput="filterSubjects()"></div>
        <div class="grid" id="subjectsGrid"><div class="no-data">جاري التحميل...</div></div>
    </div>
    <footer class="footer"><div class="divider"></div><p>Xpert &copy; 2026 - 1 Bac Sciences Expérimentales</p></footer>
    <script>
        const subjects = [
            { 
                id: "math", 
                title: "📐 الرياضيات", 
                description: "الدوال، الهندسة، الجبر، الاحتمالات، المتتاليات",
                icon: "fa-square-root-variable", 
                color: "#4ECDC4",
                lessons: 8,
                exercises: 15
            },
            { 
                id: "physique", 
                title: "⚡ الفيزياء", 
                description: "الميكانيك، الكهرباء، الموجات، الطاقة، الحرارة",
                icon: "fa-atom", 
                color: "#FF6B6B",
                lessons: 6,
                exercises: 12
            },
            { 
                id: "chimie", 
                title: "🧪 الكيمياء", 
                description: "الذرة، التفاعلات، الأحماض والقواعد، الأكسدة والاختزال",
                icon: "fa-flask", 
                color: "#F4D03F",
                lessons: 5,
                exercises: 10
            }
        ];

        function renderSubjects(filtered) {
            const grid = document.getElementById('subjectsGrid');
            const data = filtered || subjects;
            grid.innerHTML = data.map(s => `
                <div class="card" onclick="location.href='subject.html?subject=${s.id}'" style="border-right-color: ${s.color};">
                    <div style="font-size:36px; margin-bottom:8px;"><i class="fa-solid ${s.icon}" style="color:${s.color};"></i></div>
                    <h3>${s.title}</h3>
                    <p>${s.description}</p>
                    <div style="display:flex; gap:12px; margin-top:10px; flex-wrap:wrap;">
                        <span class="badge" style="background:${s.color}22; color:${s.color};"><i class="fa-solid fa-book"></i> ${s.lessons} دروس</span>
                        <span class="badge" style="background:${s.color}22; color:${s.color};"><i class="fa-solid fa-list-check"></i> ${s.exercises} تمارين</span>
                    </div>
                </div>
            `).join('');
        }

        function filterSubjects() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            if (!q) { renderSubjects(); return; }
            const filtered = subjects.filter(s => 
                s.title.toLowerCase().includes(q) || 
                s.description.toLowerCase().includes(q)
            );
            renderSubjects(filtered.length ? filtered : null);
            if (filtered.length === 0) {
                document.getElementById('subjectsGrid').innerHTML = '<div class="no-data">لا توجد نتائج</div>';
            }
        }

        renderSubjects();
    </script>
</body>
</html>
