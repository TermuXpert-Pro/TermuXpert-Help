    <style>
        /* ====== طبقة الحماية غير المرئية ====== */
        .overlay-protection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            pointer-events: all;
            cursor: default;
            opacity: 0;
            display: none;
        }
        .overlay-protection.active {
            display: block !important;
            opacity: 1 !important;
            pointer-events: all !important;
        }
        .overlay-protection.hidden {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .moroccan-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
        }
        .moroccan-bg svg { width: 100%; height: 100%; }

        .moroccan-shadow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at center, #4ECDC4 0%, #FF6B6B 40%, #F4D03F 70%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            animation: shadowPulse 8s ease-in-out infinite;
        }
        @keyframes shadowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.08; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.15; }
        }

        .moroccan-star {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            font-size: 120px;
            color: #4ECDC4;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: starSpin 20s linear infinite;
        }
        @keyframes starSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        .geo-pattern {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            color: #F4D03F;
            font-size: 20px;
            letter-spacing: 20px;
        }
        .geo-pattern-1 { top: 10%; left: 5%; transform: rotate(-15deg); }
        .geo-pattern-2 { bottom: 10%; right: 5%; transform: rotate(15deg); }
        .geo-pattern-3 { top: 50%; left: 2%; transform: rotate(90deg); }
        .geo-pattern-4 { top: 50%; right: 2%; transform: rotate(-90deg); }

        .hero-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
        }
        .hero-wrapper h1 {
            font-size: clamp(40px, 7vw, 64px);
            font-weight: 900;
            line-height: 1.2;
            text-align: center;
            padding: 0 20px;
            opacity: 0;
            transform: scale(0.8);
        }
        .hero-wrapper h1 .gradient-text {
            background: linear-gradient(135deg, #4ECDC4, #66FCF1, #F4D03F, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 300% 300%;
            animation: gradientShift 4s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .hero-wrapper .subtitle {
            color: var(--text-muted);
            font-size: clamp(16px, 2vw, 22px);
            max-width: 550px;
            margin: 10px auto 0;
            line-height: 1.8;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
        }

        .tabs-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(30px);
            position: sticky;
            top: 70px;
            z-index: 10;
            background: rgba(11, 12, 16, 0.7);
            backdrop-filter: blur(20px);
            padding: 10px 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tab-btn {
            padding: 10px 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .tab-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.2), transparent 40%, transparent 60%, rgba(255, 107, 107, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .tab-btn:hover::before { opacity: 1; }
        .tab-btn:hover {
            border-color: rgba(78, 205, 196, 0.15);
            transform: translateY(-2px);
            color: var(--text-primary);
        }
        .tab-btn:active { transform: scale(0.95); }
        .tab-btn.active {
            background: rgba(78, 205, 196, 0.08);
            border-color: rgba(78, 205, 196, 0.15);
            color: #4ECDC4;
        }
        .tab-btn i { font-size: 14px; }
        .tab-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
            min-height: 200px;
        }

        .command-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 18px 22px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
        }
        .command-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.03), rgba(255, 107, 107, 0.03));
            border-radius: 18px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .command-card:hover::before { opacity: 1; }
        .command-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(78, 205, 196, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .command-card:active { transform: scale(0.97); }

        .command-card .command-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .command-card .command-title .num {
            color: #4ECDC4;
            font-weight: 900;
            font-size: 14px;
            background: rgba(78, 205, 196, 0.08);
            padding: 2px 10px;
            border-radius: 8px;
        }
        .command-card p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
            opacity: 0.8;
        }
        .command-card .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(78, 205, 196, 0.06);
            border: 1px solid rgba(78, 205, 196, 0.06);
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .moroccan-shadow { width: 300px; height: 300px; }
            .moroccan-star { font-size: 60px; }
            .geo-pattern { font-size: 14px; letter-spacing: 12px; }
            .hero-wrapper h1 { font-size: 32px; }
            .hero-wrapper .subtitle { font-size: 14px; }
            .tabs-wrapper { gap: 6px; padding: 8px 10px; top: 60px; }
            .tab-btn { padding: 8px 14px; font-size: 12px; }
            .command-card { padding: 14px 16px; }
            .command-card .command-title { font-size: 15px; }
        }
        @media (max-width: 480px) {
            .moroccan-shadow { width: 200px; height: 200px; }
            .moroccan-star { font-size: 40px; }
            .geo-pattern { font-size: 10px; letter-spacing: 8px; }
            .hero-wrapper h1 { font-size: 24px; }
            .hero-wrapper .subtitle { font-size: 13px; }
            .tabs-wrapper { padding: 6px 8px; top: 50px; }
            .tab-btn { padding: 6px 10px; font-size: 11px; }
            .tab-btn i { font-size: 11px; }
            .command-card { padding: 12px 12px; }
            .command-card .command-title { font-size: 13px; }
            .command-card p { font-size: 12px; }
        }
    </style>
</head>

    <!-- ====== GSAP Animation ====== -->
    <script>
        // ============================================================
        // البيانات - متوافقة مع الهيكل الجديد
        // ============================================================
        const data = {
            math: {
                title: "Mathématiques",
                desc: "Cours, exercices, séries, devoirs et examens régionaux",
                lessons: [
                    { title: "Logique mathématique", file: "content/math/lessons/logique/logique.html?returnTab=lessons", desc: "Propositions, opérateurs, quantificateurs, raisonnements" },
                    { title: "Généralités sur les fonctions", file: "content/math/lessons/fonctions/index.html?returnTab=lessons", desc: "Fonctions numériques, parité, monotonie, études de fonctions" },
                    { title: "Barycentre dans le plan", file: "content/math/lessons/barycentre/index.html?returnTab=lessons", desc: "Barycentre de deux, trois et quatre points pondérés" }
                ],
                exercices: [
                    { title: "Logique mathématique", file: "content/math/exercises/logique/index.html?returnTab=exercices", desc: "8 exercices" },
                    { title: "Généralités sur les fonctions", file: "content/math/exercises/fonctions/index.html?returnTab=exercices", desc: "5 exercices" },
                    { title: "Barycentre dans le plan", file: "content/math/exercises/barycentre/index.html?returnTab=exercices", desc: "3 exercices" }
                ],
                series: [
                    { title: "Logique mathématique", file: "content/math/series/logique/index.html?returnTab=series", desc: "5 séries" },
                    { title: "Généralités sur les fonctions", file: "content/math/series/fonctions/index.html?returnTab=series", desc: "2 séries" },
                    { title: "Barycentre dans le plan", file: "content/math/series/barycentre/index.html?returnTab=series", desc: "1 série" }
                ],
                exams: []
            },
            physique: {
                title: "Physique",
                desc: "Cours, exercices, séries, devoirs et examens régionaux",
                lessons: [
                    { title: "Mouvement rectiligne", file: "content/physique/lessons/mecanique/index.html?returnTab=lessons", desc: "Position, vitesse, accélération" },
                    { title: "Lois de Newton", file: "content/physique/lessons/mecanique/newton.html?returnTab=lessons", desc: "Les trois lois de Newton" }
                ],
                exercices: [
                    { title: "Mécanique", file: "content/physique/exercises/mecanique/index.html?returnTab=exercices", desc: "2 exercices" }
                ],
                series: [
                    { title: "Mécanique", file: "content/physique/series/mecanique/index.html?returnTab=series", desc: "2 séries" }
                ],
                exams: []
            },
            chimie: {
                title: "Chimie",
                desc: "Cours, exercices, séries, devoirs et examens régionaux",
                lessons: [
                    { title: "Structure de l'atome", file: "content/chimie/lessons/atome/index.html?returnTab=lessons", desc: "Noyau, électrons, configuration" },
                    { title: "Réactions chimiques", file: "content/chimie/lessons/reactions/index.html?returnTab=lessons", desc: "Équations bilan, stoechiométrie" }
                ],
                exercices: [
                    { title: "Atome", file: "content/chimie/exercises/atome/index.html?returnTab=exercices", desc: "2 exercices" }
                ],
                series: [
                    { title: "Atome", file: "content/chimie/series/atome/index.html?returnTab=series", desc: "2 séries" }
                ],
                exams: []
            }
        };

        let currentSubject = null;
        let currentTab = 'lessons';
        let isAnimating = false;

        // ============================================================
        // تحميل المادة
        // ============================================================
        function loadSubject() {
            // ====== استعادة التبويب من URL ======
            var returnTab = new URLSearchParams(window.location.search).get("returnTab");
            if (returnTab && ["lessons", "exercices", "series", "exams"].includes(returnTab)) {
                sessionStorage.setItem("activeTab", returnTab);
            }

            const params = new URLSearchParams(window.location.search);
            const id = params.get('subject');
            currentSubject = data[id];

            if (!currentSubject) {
                document.getElementById('subjectTitle').textContent = '⚠️ Matière non trouvée';
                document.getElementById('tabContent').innerHTML = '<div class="no-data">Matière non trouvée</div>';
                return;
            }

            document.getElementById('subjectTitle').textContent = currentSubject.title;
            document.getElementById('subTitle').textContent = currentSubject.desc;

            // ====== تفعيل التبويب المستعاد ======
            var savedTab = sessionStorage.getItem('activeTab');
            if (savedTab && ["lessons", "exercices", "series", "exams"].includes(savedTab)) {
                currentTab = savedTab;
                // تحديث المظهر النشط للأزرار
                document.querySelectorAll('.tab-btn').forEach(function(btn) {
                    btn.classList.remove('active');
                    if (btn.getAttribute('data-tab') === savedTab) {
                        btn.classList.add('active');
                    }
                });
                renderContent(document.getElementById('tabContent'), savedTab);
                sessionStorage.removeItem('activeTab');
            } else {
                renderContent(document.getElementById('tabContent'), 'lessons');
            }
        }

        // ============================================================
        // تبديل التبويب - نسخة محسنة مع منع التداخل
        // ============================================================
        function switchTab(tab) {
            // ====== حفظ التبويب الحالي ======
            sessionStorage.setItem("activeTab", tab);

            // منع التبديل إذا كان أنميشن قيد التشغيل
            if (isAnimating) {
                console.log('⏳ Animation en cours, veuillez patienter...');
                return;
            }

            // منع التبديل إلى نفس التبويب
            if (tab === currentTab) {
                console.log('ℹ️ Déjà sur cet onglet');
                return;
            }

            // تفعيل حالة الأنميشن
            isAnimating = true;

            // تعطيل جميع أزرار التبويب مؤقتاً
            document.querySelectorAll('.tab-btn').forEach(b => b.disabled = true);

            const previousTab = currentTab;
            currentTab = tab;

            // تحديث المظهر النشط للأزرار
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            const container = document.getElementById('tabContent');
            const currentCards = container.querySelectorAll('.command-card');

            // إذا كانت هناك بطاقات موجودة، قم بإخفائها أولاً
            if (currentCards.length > 0) {
                gsap.to(currentCards, {
                    opacity: 0,
                    y: -20,
                    scale: 0.95,
                    duration: 0.25,
                    ease: 'power2.in',
                    stagger: 0.04,
                    onComplete: function() {
                        renderContent(container, tab, function() {
                            // إعادة تمكين الأزرار بعد الانتهاء
                            document.querySelectorAll('.tab-btn').forEach(b => b.disabled = false);
                            isAnimating = false;
                        });
                    }
                });
            } else {
                renderContent(container, tab, function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.disabled = false);
                    isAnimating = false;
                });
            }
        }

        // ============================================================
        // عرض المحتوى - نسخة محسنة مع callback
        // ============================================================
        function renderContent(container, tab, callback) {
            let html = '';

            if (tab === 'lessons') {
                html = currentSubject.lessons.map((l, i) => `
                    <div class="command-card" onclick="location.href='${l.file}'">
                        <div class="command-title">
                            <span class="num">${i+1}</span> ${l.title}
                        </div>
                        <p>${l.desc}</p>
                        <span class="badge"><i class="fas fa-eye"></i> Voir le cours</span>
                    </div>
                `).join('');
            } else if (tab === 'exercices') {
                html = currentSubject.exercices.map((e, i) => `
                    <div class="command-card" onclick="location.href='${e.file}'">
                        <div class="command-title">
                            <span class="num">${i+1}</span> ${e.title}
                        </div>
                        <p>${e.desc}</p>
                        <span class="badge" style="background:#E8873A22; color:#E8873A; border-color:#E8873A22;"><i class="fas fa-folder-open"></i> Voir les exercices</span>
                    </div>
                `).join('');
            } else if (tab === 'series') {
                html = currentSubject.series.map((s, i) => `
                    <div class="command-card" onclick="location.href='${s.file}'">
                        <div class="command-title">
                            <span class="num">${i+1}</span> ${s.title}
                        </div>
                        <p>${s.desc}</p>
                        <span class="badge" style="background:#F4D03F22; color:#F4D03F; border-color:#F4D03F22;"><i class="fas fa-folder-open"></i> Voir les séries</span>
                    </div>
                `).join('');
            } else if (tab === 'exams') {
                if (currentSubject.exams.length === 0) {
                    html = `
                        <div class="command-card" style="cursor:default; opacity:0.7;">
                            <div class="command-title">
                                <span class="num">📅</span> Prochainement
                            </div>
                            <p>Devoirs et examens seront disponibles bientôt</p>
                            <span class="badge" style="background:#BB8FCE22; color:#BB8FCE; border-color:#BB8FCE22;"><i class="fas fa-clock"></i> En préparation</span>
                        </div>
                    `;
                } else {
                    html = currentSubject.exams.map((e, i) => `
                        <div class="command-card">
                            <div class="command-title">
                                <span class="num">${i+1}</span> ${e.title}
                            </div>
                            <p><span class="badge" style="background:${e.type === 'Devoir' ? '#FF6B6B22' : '#BB8FCE22'}; color:${e.type === 'Devoir' ? '#FF6B6B' : '#BB8FCE'}; border-color:${e.type === 'Devoir' ? '#FF6B6B22' : '#BB8FCE22'};">${e.type}</span></p>
                            <span class="badge" style="background:#4ECDC422; color:#4ECDC4; border-color:#4ECDC422;"><i class="fas fa-download"></i> Télécharger</span>
                        </div>
                    `).join('');
                }
            }

            container.innerHTML = html;

            const newCards = container.querySelectorAll('.command-card');
            if (newCards.length > 0) {
                gsap.fromTo(newCards, 
                    { opacity: 0, y: 40, scale: 0.95 },
                    { 
                        opacity: 1, 
                        y: 0, 
                        scale: 1, 
                        duration: 0.5, 
                        stagger: 0.08,
                        ease: 'power3.out',
                        onComplete: function() {
                            if (callback) callback();
                        }
                    }
                );
            } else {
                if (callback) callback();
            }

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        // ============================================================
        // GSAP - إدارة الأنميشن
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {

            // ====== التحقق من تحميل GSAP ======
            if (typeof gsap === 'undefined') {
                console.error('❌ GSAP غير محمل في subject.html!');
                // عرض المحتوى مباشرة
                document.querySelector('.moroccan-bg').style.opacity = '0.6';
                document.querySelector('.moroccan-shadow').style.opacity = '0.08';
                document.querySelector('.moroccan-star').style.opacity = '0.04';
                document.querySelectorAll('.geo-pattern').forEach(function(el) {
                    el.style.opacity = '0.03';
                });
                document.getElementById('contentWrapper').style.opacity = '1';
                document.getElementById('tabsWrapper').style.opacity = '1';
                document.getElementById('tabsWrapper').style.transform = 'none';
                document.querySelectorAll('.command-card').forEach(function(el) {
                    el.style.opacity = '1';
                    el.style.transform = 'none';
                });
                document.getElementById('overlayProtection').classList.add('hidden');
                loadSubject();
                return;
            }

            loadSubject();

            const overlay = document.getElementById('overlayProtection');

            // ====== التحقق من نوع التنقل ======
            const navType = performance.navigation.type;

            // ====== التحقق من إذن تشغيل الأنميشن ======
            const animationAllowed = sessionStorage.getItem('animation_allowed');

            // ====== دالة للعرض المباشر (بدون أنميشن) ======
            function showDirect() {
                gsap.set('#heroWrapper', { opacity: 0, display: 'none' });
                gsap.set('.moroccan-bg', { opacity: 0.6 });
                gsap.set('.moroccan-shadow', { opacity: 0.08 });
                gsap.set('.moroccan-star', { opacity: 0.04 });
                gsap.set('.geo-pattern', { opacity: 0.03 });
                gsap.set('#contentWrapper', { opacity: 1 });
                gsap.set('#tabsWrapper', { opacity: 1, y: 0 });

                overlay.classList.remove('active');
                overlay.classList.add('hidden');
                overlay.style.display = 'none';
                overlay.style.pointerEvents = 'none';

                console.log('✅ subject.html - Affichage direct (sans animation)');

                gsap.to('.moroccan-bg', { opacity: 0.8, duration: 4, repeat: -1, yoyo: true, ease: 'sine.inOut' });
                gsap.to('.moroccan-star', { rotation: 360, duration: 30, repeat: -1, ease: 'none' });
            }

            // ====== دالة لتشغيل الأنميشن ======
            function runAnimation() {
                overlay.classList.add('active');
                gsap.set('#heroWrapper', { display: 'flex', opacity: 0 });

                const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

                tl
                    .to('.moroccan-bg', { opacity: 0.6, duration: 2, ease: 'power1.out' })
                    .to('.moroccan-shadow', { opacity: 0.08, duration: 2, ease: 'power1.out' }, '-=1.4')
                    .to('.moroccan-star', { opacity: 0.04, duration: 2, ease: 'power1.out' }, '-=1.4')
                    .to('.geo-pattern', { opacity: 0.03, duration: 2, stagger: 0.08, ease: 'power1.out' }, '-=1.6')
                    .to('#heroWrapper', { opacity: 1, duration: 0.8, ease: 'power2.out' }, '-=0.5')
                    .to('#mainTitle', { opacity: 1, scale: 1, duration: 1.4, ease: 'back.out(2)' }, '-=0.3')
                    .to('#subTitle', { opacity: 1, y: 0, duration: 1, ease: 'power3.out' }, '-=0.5')
                    .to('#mainTitle', { opacity: 0, y: -80, scale: 0.7, duration: 1.6, ease: 'power3.inOut', delay: 1.8 })
                    .to('#subTitle', { opacity: 0, y: -50, duration: 1.4, ease: 'power3.inOut', delay: 1.6 }, '-=0.8')
                    .to('#heroWrapper', { 
                        opacity: 0, 
                        duration: 0.6, 
                        ease: 'power2.in',
                        onComplete: function() {
                            gsap.set('#heroWrapper', { display: 'none' });
                        }
                    }, '-=0.4')
                    .to('#contentWrapper', { opacity: 1, duration: 0.6, ease: 'power2.out' }, '-=0.2')
                    .to('#tabsWrapper', { opacity: 1, y: 0, duration: 0.8, ease: 'back.out(1.2)' }, '-=0.3')
                    .call(() => {
                        sessionStorage.removeItem('animation_allowed');
                        overlay.classList.remove('active');
                        overlay.classList.add('hidden');
                        overlay.style.display = 'none';
                        overlay.style.pointerEvents = 'none';
                        console.log('✅ subject.html - Animation jouée');
                    });

                gsap.to('.moroccan-bg', { opacity: 0.8, duration: 4, repeat: -1, yoyo: true, ease: 'sine.inOut' });
                gsap.to('.moroccan-star', { rotation: 360, duration: 30, repeat: -1, ease: 'none' });

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('mouseenter', function() {
                        gsap.to(this, { scale: 1.05, duration: 0.2, ease: 'power2.out' });
                    });
                    btn.addEventListener('mouseleave', function() {
                        gsap.to(this, { scale: 1, duration: 0.2, ease: 'power2.inOut' });
                    });
                });
            }

            // ============================================================
            // المنطق الرئيسي
            // ============================================================

            if (navType === 2) {
                showDirect();
                console.log('📌 subject.html - Navigation depuis Back/Forward → Affichage direct');
                return;
            }

            if (animationAllowed !== 'true') {
                showDirect();
                console.log('📌 subject.html - Animation non autorisée → Affichage direct');
                return;
            }

            runAnimation();
            console.log('📌 subject.html - Animation autorisée → Animation jouée');
        });
    </script>
</body>
</html>
