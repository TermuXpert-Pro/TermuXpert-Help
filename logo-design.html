<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Design - Xpert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700;900&family=Great+Vibes&family=Tangerine:wght@700&family=Alex+Brush&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0B0C10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }
        /* خلفية متحركة */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(78, 205, 196, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(78, 205, 196, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.15;
            animation: orbFloat 10s ease-in-out infinite;
        }
        .glow-orb-1 {
            width: 400px;
            height: 400px;
            background: #4ECDC4;
            top: -10%;
            right: -10%;
        }
        .glow-orb-2 {
            width: 350px;
            height: 350px;
            background: #FF6B6B;
            bottom: -10%;
            left: -10%;
            animation-delay: 5s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* ====== حاوية الشعار ====== */
        .logo-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 60px;
            background: rgba(11, 12, 16, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(78, 205, 196, 0.15);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            min-width: 500px;
            min-height: 400px;
            transition: all 0.5s ease;
        }
        .logo-container:hover {
            border-color: rgba(78, 205, 196, 0.3);
            box-shadow: 0 30px 80px rgba(78, 205, 196, 0.1);
        }

        /* ====== زخرفة خارجية ====== */
        .border-deco {
            position: absolute;
            color: #F4D03F;
            font-size: 14px;
            letter-spacing: 6px;
            opacity: 0.4;
        }
        .border-deco.top {
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
        }
        .border-deco.bottom {
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
        }
        .border-deco.left {
            top: 50%;
            left: 12px;
            transform: translateY(-50%) rotate(90deg);
        }
        .border-deco.right {
            top: 50%;
            right: 12px;
            transform: translateY(-50%) rotate(90deg);
        }

        /* ====== الشعار الرئيسي ====== */
        .main-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            padding: 20px 0;
        }

        /* JAOUAD - فوق */
        .name-top {
            font-family: 'Great Vibes', cursive;
            font-size: 22px;
            font-weight: 400;
            color: #4ECDC4;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(78, 205, 196, 0.2);
            opacity: 0.9;
            position: relative;
        }
        .name-top::before {
            content: "◈ ";
            color: #F4D03F;
            font-size: 12px;
        }
        .name-top::after {
            content: " ◈";
            color: #F4D03F;
            font-size: 12px;
        }

        /* ====== MOROCCO ====== */
        .name-center {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 16px;
            line-height: 1;
            position: relative;
            padding: 10px 0;
            background: linear-gradient(135deg, #4ECDC4 0%, #66FCF1 25%, #F4D03F 50%, #FF6B6B 75%, #A8FF78 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(78, 205, 196, 0.1));
        }
        /* زخرفة حول MOROCCO */
        .name-center::before {
            content: "✦ ✧ ✦ ✧ ✦";
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #F4D03F;
            -webkit-text-fill-color: #F4D03F;
            letter-spacing: 8px;
            opacity: 0.5;
            font-weight: 400;
        }
        .name-center::after {
            content: "✦ ✧ ✦ ✧ ✦";
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #F4D03F;
            -webkit-text-fill-color: #F4D03F;
            letter-spacing: 8px;
            opacity: 0.5;
            font-weight: 400;
        }

        /* ====== ELKHAYATY ====== */
        .name-bottom {
            font-family: 'Great Vibes', cursive;
            font-size: 22px;
            font-weight: 400;
            color: #FF6B6B;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(255, 107, 107, 0.2);
            opacity: 0.9;
            position: relative;
        }
        .name-bottom::before {
            content: "◈ ";
            color: #F4D03F;
            font-size: 12px;
        }
        .name-bottom::after {
            content: " ◈";
            color: #F4D03F;
            font-size: 12px;
        }

        /* ====== زخارف جانبية ====== */
        .side-deco {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 6px 0;
            opacity: 0.3;
        }
        .side-deco .line {
            width: 40px;
            height: 1px;
            background: linear-gradient(to right, transparent, #4ECDC4, transparent);
        }
        .side-deco .diamond {
            color: #F4D03F;
            font-size: 10px;
        }
        .side-deco .line.green {
            background: linear-gradient(to right, transparent, #A8FF78, transparent);
        }
        .side-deco .line.red {
            background: linear-gradient(to right, transparent, #FF6B6B, transparent);
        }

        /* ====== زر الإغلاق ====== */
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            color: #C5C6C7;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .close-btn:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: #FF6B6B;
            color: #FF6B6B;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            .logo-container {
                min-width: 90%;
                padding: 30px 20px;
                border-radius: 20px;
            }
            .name-center {
                font-size: 48px;
                letter-spacing: 8px;
            }
            .name-top, .name-bottom {
                font-size: 18px;
            }
            .name-center::before,
            .name-center::after {
                font-size: 10px;
                letter-spacing: 4px;
            }
            .border-deco {
                font-size: 10px;
                letter-spacing: 3px;
            }
        }
        @media (max-width: 480px) {
            .logo-container {
                min-width: 95%;
                padding: 20px 12px;
                border-radius: 16px;
            }
            .name-center {
                font-size: 32px;
                letter-spacing: 4px;
            }
            .name-top, .name-bottom {
                font-size: 14px;
            }
            .name-center::before,
            .name-center::after {
                font-size: 8px;
                letter-spacing: 3px;
                top: -18px;
            }
            .name-center::after {
                bottom: -18px;
                top: auto;
            }
            .side-deco .line {
                width: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- خلفية -->
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- زر الإغلاق -->
    <a href="index.html" class="close-btn">
        <i class="fas fa-times"></i> Fermer
    </a>

    <!-- ====== الشعار ====== -->
    <div class="logo-container">
        <!-- زخارف حدودية -->
        <span class="border-deco top">✦ ✧ ✦ ✧ ✦</span>
        <span class="border-deco bottom">✦ ✧ ✦ ✧ ✦</span>
        <span class="border-deco left">✦ ✧ ✦ ✧ ✦</span>
        <span class="border-deco right">✦ ✧ ✦ ✧ ✦</span>

        <!-- زخارف جانبية -->
        <div class="side-deco">
            <span class="line"></span>
            <span class="diamond">◆</span>
            <span class="line green"></span>
        </div>

        <!-- الشعار الرئيسي -->
        <div class="main-logo">
            <span class="name-top">JAOUAD</span>
            <span class="name-center">MOROCCO</span>
            <span class="name-bottom">ELKHAYATY</span>
        </div>

        <!-- زخارف جانبية -->
        <div class="side-deco">
            <span class="line red"></span>
            <span class="diamond">◆</span>
            <span class="line"></span>
        </div>

        <!-- نص صغير تحت -->
        <div style="margin-top:10px; font-size:11px; color:rgba(197,198,199,0.3); letter-spacing:6px; font-weight:300;">
            ✦ ✧ ✦ ✧ ✦
        </div>
    </div>
</body>
</html>
