    <style>
        /* ====== تصميم صفحة التقويم (بطاقات/جداول) - محافظ عليه كما هو ====== */
        .cal-wrap{
            --cal-gold:#F4D03F;
            --cal-gold-soft:#F7DC6F;
            --cal-teal:#4ECDC4;
            position:relative; z-index:1; max-width:820px; margin:0 auto; padding:60px 12px 20px;
            direction:rtl;
        }

        .cal-hero{text-align:center; margin-bottom:34px;}
        .cal-hero .cal-eyebrow{
            display:inline-flex; align-items:center; gap:8px;
            color:var(--cal-gold); font-size:13px; font-weight:700;
            letter-spacing:0.5px; background:rgba(244,208,63,0.08);
            padding:6px 16px; border-radius:20px; border:1px solid rgba(244,208,63,0.25);
            margin-bottom:16px;
        }
        .cal-hero h1{
            font-size:clamp(24px, 5vw, 34px); font-weight:900; color:#fff;
            margin-bottom:8px; font-family:'Cairo','Tajawal',sans-serif;
        }
        .cal-hero h1 span{color:var(--cal-gold);}
        .cal-hero p{color:var(--text-muted); font-size:14px; font-family:'Cairo','Tajawal',sans-serif;}

        .cal-section{
            background:var(--bg-card);
            border:1px solid var(--border);
            border-radius:16px;
            padding:22px 20px;
            margin-bottom:20px;
            position:relative;
            overflow:hidden;
        }
        .cal-section::before{
            content:"";
            position:absolute; top:0; right:0; width:4px; height:100%;
            background:linear-gradient(180deg, var(--cal-gold), transparent);
        }
        .cal-section h2{
            display:flex; align-items:center; gap:10px;
            font-size:17px; font-weight:700; color:var(--cal-gold);
            margin-bottom:14px; font-family:'Cairo','Tajawal',sans-serif;
        }
        .cal-section h2 i{font-size:15px;}

        .cal-date-row{
            display:flex; align-items:center; gap:14px;
            background:var(--bg-primary);
            border:1px solid var(--border);
            border-radius:10px;
            padding:12px 14px;
            margin-bottom:10px;
        }
        .cal-date-row:last-child{margin-bottom:0;}
        .cal-date-badge{
            flex-shrink:0; min-width:74px; text-align:center;
            background:rgba(244,208,63,0.12); color:var(--cal-gold);
            font-weight:700; font-size:13px; padding:8px 6px; border-radius:8px;
            font-family:'Cairo','Tajawal',sans-serif;
        }
        .cal-date-badge.teal{background:rgba(78,205,196,0.12); color:var(--cal-teal);}
        .cal-date-text{font-size:13.5px; color:var(--text-secondary); font-family:'Cairo','Tajawal',sans-serif;}
        .cal-date-text strong{color:var(--text-primary);}

        .cal-table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--border);}
        .cal-table-wrap table{width:100%; border-collapse:collapse; font-size:13px; background:var(--bg-primary); font-family:'Cairo','Tajawal',sans-serif;}
        .cal-table-wrap th{
            background:rgba(244,208,63,0.08); color:var(--cal-gold);
            padding:9px 8px; font-weight:700; text-align:center;
            border-bottom:1px solid var(--border);
        }
        .cal-table-wrap td{
            padding:8px 8px; text-align:center; color:var(--text-secondary);
            border-bottom:1px solid var(--border);
        }
        .cal-table-wrap tr:last-child td{border-bottom:none;}
        .cal-table-wrap td.label{color:var(--text-primary); font-weight:600; text-align:right;}

        .cal-cta-wrap{text-align:center; margin-top:30px;}
        .cal-cta-btn{
            display:inline-flex; align-items:center; gap:10px;
            background:linear-gradient(135deg, var(--cal-gold), var(--cal-gold-soft));
            color:#1A1A1A; font-weight:700; font-size:15px; font-family:'Cairo','Tajawal',sans-serif;
            padding:14px 28px; border-radius:12px; text-decoration:none;
            box-shadow:0 8px 24px rgba(244,208,63,0.25);
            transition:transform 0.25s ease, box-shadow 0.25s ease;
        }
        .cal-cta-btn:hover{transform:translateY(-3px); box-shadow:0 12px 30px rgba(244,208,63,0.35);}
        .cal-cta-note{color:var(--text-muted); font-size:12px; margin-top:10px; font-family:'Cairo','Tajawal',sans-serif;}

        @media (max-width:480px){
            .cal-date-row{flex-direction:column; align-items:flex-start; gap:6px;}
            .cal-date-badge{min-width:unset;}
        }
    </style>
