<!-- Xpert - Page mise à jour -->
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpert - 1 Bac Sciences Expérimentales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        /* ====== طبقة الحماية ====== */
        .overlay-protection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            pointer-events: all;
            cursor: default;
            opacity: 0;
            display: none;
        }
        .overlay-protection.active {
            display: block !important;
            opacity: 1 !important;
            pointer-events: all !important;
        }
        .overlay-protection.hidden {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* ====== المحتوى الرئيسي ====== */
        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: clamp(80px, 15vh, 120px) var(--container-padding) clamp(40px, 6vh, 60px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        .profile-outer {
            position: relative;
            z-index: 2;
            margin-bottom: 0px;
            opacity: 0;
            transform: translateY(20px);
        }
        .profile-outer .profile-ring {
            position: absolute;
            top: -12px;
            left: -12px;
            width: 164px;
            height: 164px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #4ECDC4, #F4D03F, #FF6B6B) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.4;
            animation: ringSpin 12s linear infinite;
        }
        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .profile-outer .profile-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(78, 205, 196, 0.25);
            box-shadow: 0 0 50px rgba(78, 205, 196, 0.12);
            transition: all 0.4s ease;
            background: rgba(255,255,255,0.05);
            display: block;
        }
        .profile-outer .profile-image:hover {
            transform: scale(1.05);
            border-color: rgba(78, 205, 196, 0.5);
        }

        .hero-card {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(78, 205, 196, 0.1);
            border-radius: 30px;
            padding: 50px 50px 50px;
            max-width: 700px;
            width: 100%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(30px);
        }

        .hero-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(20px);
        }
        .hero-logo .name-center {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, #4ECDC4 0%, #66FCF1 25%, #F4D03F 50%, #FF6B6B 75%, #A8FF78 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 300% 300%;
            animation: gradientShift 6s ease-in-out infinite;
            letter-spacing: 14px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 40px rgba(78, 205, 196, 0.15));
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(69, 162, 158, 0.1);
            border: 1px solid rgba(69, 162, 158, 0.2);
            color: #66FCF1;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 14px;
            opacity: 0;
            transform: translateY(20px);
        }
        .hero-label .dot {
            width: 6px;
            height: 6px;
            background: #06D6A0;
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(20px);
        }
        .hero h1 .gradient-text {
            background: linear-gradient(135deg, #4ECDC4, #66FCF1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero .description {
            color: var(--text-muted);
            font-size: clamp(12px, 1.5vw, 15px);
            max-width: 500px;
            margin: 0 auto 16px;
            line-height: 1.8;
            opacity: 0;
            transform: translateY(20px);
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
        }

        @media (max-width: 768px) {
            .hero-card { padding: 30px 20px 40px; }
            .hero-logo .name-center { font-size: 32px; letter-spacing: 8px; }
            .profile-outer .profile-image { width: 100px; height: 100px; }
            .profile-outer .profile-ring { width: 124px; height: 124px; top: -12px; left: -12px; }
        }
        @media (max-width: 480px) {
            .hero-card { padding: 20px 12px 30px; }
            .hero-logo .name-center { font-size: 22px; letter-spacing: 4px; }
            .profile-outer .profile-image { width: 80px; height: 80px; }
            .profile-outer .profile-ring { width: 104px; height: 104px; top: -12px; left: -12px; }
            .hero { padding: 70px 12px 30px; min-height: 60vh; }
            .hero-buttons { flex-direction: column; width: 100%; }
            .hero-buttons .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- ====== طبقة الحماية ====== -->
    <div class="overlay-protection" id="overlayProtection"></div>

    <!-- ====== الخلفية المغربية (مدمجة مباشرة) ====== -->
    <div class="moroccan-bg">
        <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="zellij" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
                    <rect width="200" height="200" fill="none"/>
                    <polygon points="100,0 200,100 100,200 0,100" fill="none" stroke="#4ECDC4" stroke-width="0.5" opacity="0.3"/>
                    <polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="#66FCF1" stroke-width="0.5" opacity="0.2"/>
                    <polygon points="100,40 160,100 100,160 40,100" fill="none" stroke="#F4D03F" stroke-width="0.5" opacity="0.2"/>
                    <polygon points="100,60 140,100 100,140 60,100" fill="none" stroke="#FF6B6B" stroke-width="0.5" opacity="0.2"/>
                    <text x="100" y="100" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#F4D03F" opacity="0.2">✦</text>
                    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <text x="150" y="50" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <text x="50" y="150" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-size="6" fill="#4ECDC4" opacity="0.15">✦</text>
                    <line x1="0" y1="0" x2="200" y2="200" stroke="#4ECDC4" stroke-width="0.3" opacity="0.1"/>
                    <line x1="200" y1="0" x2="0" y2="200" stroke="#4ECDC4" stroke-width="0.3" opacity="0.1"/>
                    <line x1="100" y1="0" x2="100" y2="200" stroke="#4ECDC4" stroke-width="0.3" opacity="0.05"/>
                    <line x1="0" y1="100" x2="200" y2="100" stroke="#4ECDC4" stroke-width="0.3" opacity="0.05"/>
                </pattern>
            </defs>
            <rect width="800" height="800" fill="url(#zellij)"/>
        </svg>
    </div>

    <div class="moroccan-shadow"></div>
    <div class="moroccan-star">✦</div>

    <div class="geo-pattern geo-pattern-1">✦ ✧ ✦ ✧ ✦</div>
    <div class="geo-pattern geo-pattern-2">✦ ✧ ✦ ✧ ✦</div>
    <div class="geo-pattern geo-pattern-3">✦ ✧ ✦ ✧ ✦</div>
    <div class="geo-pattern geo-pattern-4">✦ ✧ ✦ ✧ ✦</div>

    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- ====== شريط التنقل ====== -->
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">X</div>
            <div class="nav-logo-text"><span>X</span>pert</div>
        </a>
        <ul class="nav-links">
            <li><a href="subjects.html"><i class="fas fa-book-open"></i> Matières</a></li>
            <li><a href="subjects.html" class="btn-nav" onclick="sessionStorage.setItem('animation_allowed', 'true');"><i class="fas fa-graduation-cap"></i> Commencer</a></li>
        </ul>
    </nav>

    <!-- ====== المحتوى ====== -->
    <section class="hero" id="heroSection">
        <div class="profile-outer" id="profileWrapper">
            <div style="position:relative; display:inline-block;">
                <div class="profile-ring"></div>
                <img src="photos/profile.png" alt="Profile" class="profile-image" id="profileImg">
            </div>
        </div>

        <div class="hero-card" id="heroCard">
            <div class="hero-logo" id="logo">
                <span class="name-center">MOROCCO</span>
            </div>
            <div class="hero-label" id="label"><span class="dot"></span> 1 Bac Sciences Expérimentales</div>
            <h1 id="title">Plateforme <span class="gradient-text">Xpert</span></h1>
            <p class="description" id="desc">Cours, exercices, séries, devoirs et examens régionaux en Mathématiques, Physique et Chimie.</p>
            <div class="hero-buttons" id="buttons">
                <a href="subjects.html" class="btn btn-primary" onclick="sessionStorage.setItem('animation_allowed', 'true');"><i class="fas fa-graduation-cap"></i> Commencer</a>
            </div>
        </div>
    </section>

    <!-- ====== التذييل ====== -->
    <footer class="footer">
        <div class="divider"></div>
        <p>Xpert &copy; 2026 - 1 Bac Sciences Expérimentales</p>
    </footer>

    <button class="scroll-top-btn" aria-label="Retour en haut">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- ====== السكريبتات ====== -->
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            const overlay = document.getElementById('overlayProtection');
            
            // ====== تفعيل طبقة الحماية ======
            overlay.classList.add('active');
            
            // ====== أنميشن الخلفيات ======
            const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

            tl
                // 1. ظهور الخلفيات
                .to('.moroccan-bg', { opacity: 0.6, duration: 1.8, ease: 'power1.out' })
                .to('.moroccan-shadow', { opacity: 0.08, duration: 1.8, ease: 'power1.out' }, '-=1.2')
                .to('.moroccan-star', { opacity: 0.04, duration: 1.8, ease: 'power1.out' }, '-=1.2')
                .to('.geo-pattern', { opacity: 0.03, duration: 1.8, stagger: 0.08, ease: 'power1.out' }, '-=1.4')
                
                // 2. ظهور الهيرو
                .to('#heroSection', { opacity: 1, duration: 0.8, ease: 'power2.out' }, '-=0.5')
                
                // 3. ظهور البروفايل
                .to('#profileWrapper', { opacity: 1, y: 0, duration: 1, ease: 'back.out(1.7)' }, '-=0.3')
                .to('#profileImg', { 
                    scale: 1, 
                    duration: 0.8, 
                    ease: 'back.out(2)',
                    onStart: function() {
                        gsap.fromTo('#profileImg', 
                            { scale: 0.6, opacity: 0, rotation: -10 },
                            { scale: 1, opacity: 1, rotation: 0, duration: 0.8, ease: 'back.out(2)' }
                        );
                    }
                }, '-=0.6')
                
                // 4. ظهور البطاقة
                .to('#heroCard', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, '-=0.3')
                
                // 5. ظهور الشعار
                .to('#logo', { opacity: 1, y: 0, duration: 0.8, ease: 'back.out(1.7)' }, '-=0.4')
                .fromTo('.name-center', 
                    { scale: 0.8, opacity: 0 },
                    { scale: 1, opacity: 1, duration: 0.8, ease: 'back.out(2)' },
                    '-=0.4'
                )
                
                // 6. ظهور باقي العناصر
                .to('.hero-label', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
                .to('#title', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
                .to('#desc', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
                .to('#buttons', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
                
                // 7. إزالة طبقة الحماية
                .call(function() {
                    overlay.classList.remove('active');
                    overlay.classList.add('hidden');
                    overlay.style.display = 'none';
                    overlay.style.pointerEvents = 'none';
                    console.log('✅ Overlay protection removed');
                });

            // ====== حركات مستمرة ======
            gsap.to('.moroccan-bg', {
                opacity: 0.8,
                duration: 3,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 2
            });

            gsap.to('.moroccan-star', {
                rotation: 360,
                duration: 30,
                repeat: -1,
                ease: 'none',
                delay: 2
            });

            gsap.to('.geo-pattern-1', {
                x: 20, y: 10,
                duration: 4,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 2
            });
            gsap.to('.geo-pattern-2', {
                x: -20, y: -10,
                duration: 4,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 3
            });
            gsap.to('.geo-pattern-3', {
                x: 15, y: -15,
                duration: 5,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 2.5
            });
            gsap.to('.geo-pattern-4', {
                x: -15, y: 15,
                duration: 5,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 3.5
            });

            // ====== Hover Effects ======
            const card = document.querySelector('.hero-card');
            card.addEventListener('mouseenter', function() {
                gsap.to(this, {
                    scale: 1.01,
                    duration: 0.3,
                    ease: 'power2.out',
                    boxShadow: '0 40px 100px rgba(0,0,0,0.4)'
                });
            });
            card.addEventListener('mouseleave', function() {
                gsap.to(this, {
                    scale: 1,
                    duration: 0.3,
                    ease: 'power2.inOut',
                    boxShadow: '0 30px 80px rgba(0,0,0,0.3)'
                });
            });

            const btn = document.querySelector('.btn-primary');
            if (btn) {
                btn.addEventListener('mouseenter', function() {
                    gsap.to(this, {
                        scale: 1.05,
                        duration: 0.2,
                        ease: 'power2.out',
                        boxShadow: '0 8px 30px rgba(69, 162, 158, 0.4)'
                    });
                });
                btn.addEventListener('mouseleave', function() {
                    gsap.to(this, {
                        scale: 1,
                        duration: 0.2,
                        ease: 'power2.inOut',
                        boxShadow: '0 4px 20px rgba(69, 162, 158, 0.2)'
                    });
                });
            }

            console.log('✅ Home page animation complete!');
        });
    </script>
</body>
</html>
