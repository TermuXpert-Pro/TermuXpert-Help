<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpert - Matière</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-size: 14px !important; }
        .navbar { height: 50px !important; padding: 0 12px !important; }
        .nav-logo-icon { width: 28px !important; height: 28px !important; font-size: 14px !important; }
        .nav-logo-text { font-size: 16px !important; }
        .nav-links a { font-size: 12px !important; padding: 4px 10px !important; }
        .hero { padding: 60px 20px 30px !important; min-height: auto !important; }
        .hero h1 { font-size: 24px !important; }
        .hero .description { font-size: 14px !important; }
        .back-btn { font-size: 13px !important; padding: 6px 14px !important; margin-bottom: 16px !important; }
        .tab-btn { font-size: 13px !important; padding: 6px 14px !important; }
        .command-card { padding: 12px 16px !important; margin-bottom: 10px !important; cursor: pointer; }
        .command-card:hover { border-color: #4ECDC4; transform: translateX(-3px); }
        .command-card:active { transform: scale(0.97); }
        .command-title { font-size: 15px !important; }
        .command-card p { font-size: 13px !important; }
        .badge { font-size: 11px !important; padding: 2px 10px !important; }
        .footer p { font-size: 12px !important; }
        .badge-exercice {
            display: inline-block;
            background: rgba(78, 205, 196, 0.15);
            color: #4ECDC4;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .badge-facile { background: #4ECDC422; color: #4ECDC4; }
        .badge-moyen { background: #F4D03F22; color: #F4D03F; }
        .badge-difficile { background: #FF6B6B22; color: #FF6B6B; }
        .ex-link {
            display: block;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .ex-link:hover { border-color: #4ECDC4; transform: translateX(-3px); }
        .ex-link:active { transform: scale(0.97); opacity: 0.8; }
        .ex-link .ex-icon { font-size: 18px; flex-shrink: 0; }
        .ex-link .ex-num { font-size: 13px; color: #4ECDC4; font-weight: 700; }
        .ex-link .ex-title { font-size: 12px; color: var(--text-secondary); }
        .ex-link .ex-arrow { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
        .back-btn-small {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            border: none;
        }
        .back-btn-small:hover { background: rgba(69, 162, 158, 0.1); }
        .back-btn-small:active { opacity: 0.6; transform: scale(0.95); }
        @media (max-width: 768px) {
            body { font-size: 13px !important; }
            .hero h1 { font-size: 20px !important; }
            .tabs { gap: 4px !important; }
            .tab-btn { font-size: 12px !important; padding: 4px 10px !important; }
            .ex-link { padding: 6px 10px !important; }
            .ex-link .ex-num { font-size: 12px !important; }
            .ex-link .ex-title { font-size: 11px !important; }
        }
        @media (max-width: 480px) {
            .nav-links a { font-size: 11px !important; padding: 4px 8px !important; }
            .hero h1 { font-size: 18px !important; }
            .tabs { flex-wrap: wrap; }
            .ex-link { padding: 4px 8px !important; }
            .ex-link .ex-num { font-size: 11px !important; }
            .ex-link .ex-title { font-size: 10px !important; }
            .ex-link .ex-icon { font-size: 14px !important; }
        }
    </style>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
    <div class="bg-grid"></div>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">X</div>
            <div class="nav-logo-text"><span>X</span>pert</div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-house"></i> Accueil</a></li>
            <li><a href="subjects.html"><i class="fas fa-book-open"></i> Matières</a></li>
        </ul>
    </nav>
    <div class="hero" style="min-height:auto; padding:60px 20px 30px;">
        <h1 style="font-size:24px;" id="subjectTitle">Matière</h1>
        <p class="description" style="font-size:14px;" id="subjectDesc">Tous les contenus de la matière</p>
    </div>
    <div style="max-width:900px; margin:0 auto; padding:0 20px 40px;">
        <a href="subjects.html" class="back-btn"><i class="fas fa-arrow-right"></i> Retour aux matières</a>
        
        <div class="tabs" style="display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; border-bottom:2px solid var(--border); padding-bottom:10px;">
            <button class="tab-btn active" data-tab="lessons" onclick="switchTab('lessons')"><i class="fas fa-book"></i> Cours</button>
            <button class="tab-btn" data-tab="exercices" onclick="switchTab('exercices')"><i class="fas fa-pencil"></i> Exercices</button>
            <button class="tab-btn" data-tab="series" onclick="switchTab('series')"><i class="fas fa-list-check"></i> Séries</button>
            <button class="tab-btn" data-tab="exams" onclick="switchTab('exams')"><i class="fas fa-pen-to-square"></i> Devoirs & Examens</button>
        </div>
        
        <div id="tabContent"><div class="no-data">Chargement...</div></div>
    </div>
    <footer class="footer"><div class="divider"></div><p>Xpert &copy; 2026 - 1 Bac Sciences Expérimentales</p></footer>

    <button class="scroll-top-btn" aria-label="Retour en haut">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
    <script>
        const data = {
            math: {
                title: "Mathématiques",
                desc: "Cours, exercices, séries, devoirs et examens régionaux",
                lessons: [
                    { title: "Logique mathématique", file: "lessons/logique.html", desc: "Propositions, opérateurs, quantificateurs, raisonnements" },
                    { title: "Généralités sur les fonctions", file: "lessons/fonctions/index.html", desc: "Fonctions numériques, parité, monotonie, études de fonctions" },
                    { title: "Barycentre dans le plan", file: "lessons/barycentre/index.html", desc: "Barycentre de deux, trois et quatre points pondérés" },
                    { title: "Raisonnement par récurrence", file: "lessons/recurrence.html", desc: "Principe de récurrence, exemples" }
                ],
                exercices: [
                    {
                        title: "Logique mathématique",
                        icon: "🧠",
                        file: "exercices/logique/index.html",
                        list: [
                            { num: 1, title: "Valeur de vérité et négation", file: "exercices/logique/exercice1.html", diff: "Facile" },
                            { num: 2, title: "Quantificateurs", file: "exercices/logique/exercice2.html", diff: "Facile" },
                            { num: 3, title: "Valeur de vérité", file: "exercices/logique/exercice3.html", diff: "Facile" },
                            { num: 4, title: "Raisonnement", file: "exercices/logique/exercice4.html", diff: "Moyen" },
                            { num: 5, title: "Lois logiques", file: "exercices/logique/exercice5.html", diff: "Moyen" },
                            { num: 6, title: "Implication", file: "exercices/logique/exercice6.html", diff: "Moyen" },
                            { num: 7, title: "Récurrence - Divisibilité", file: "exercices/logique/exercice7.html", diff: "Difficile" },
                            { num: 8, title: "Récurrence - Sommes", file: "exercices/logique/exercice8.html", diff: "Difficile" }
                        ]
                    },
                    {
                        title: "Généralités sur les fonctions",
                        icon: "📈",
                        file: "exercices/fonctions/index.html",
                        list: [
                            { num: 1, title: "Rappels", file: "exercices/fonctions/exercice1.html", diff: "Facile" },
                            { num: 2, title: "Fonction majorée/minorée/bornée", file: "exercices/fonctions/exercice2.html", diff: "Facile" },
                            { num: 3, title: "Comparaison de fonctions", file: "exercices/fonctions/exercice3.html", diff: "Moyen" },
                            { num: 4, title: "Étude des fonctions de référence", file: "exercices/fonctions/exercice4.html", diff: "Moyen" },
                            { num: 5, title: "Exercices", file: "exercices/fonctions/exercice5.html", diff: "Difficile" }
                        ]
                    },
                    {
                        title: "Barycentre dans le plan",
                        icon: "⚖️",
                        file: "exercices/barycentre/index.html",
                        list: [
                            { num: 1, title: "Barycentre de deux points", file: "exercices/barycentre/exercice1.html", diff: "Facile" },
                            { num: 2, title: "Barycentre de trois points", file: "exercices/barycentre/exercice2.html", diff: "Moyen" },
                            { num: 3, title: "Barycentre de quatre points", file: "exercices/barycentre/exercice3.html", diff: "Difficile" }
                        ]
                    }
                ],
                series: [
                    { title: "Série 1: Logique mathématique", items: 10 },
                    { title: "Série 2: Fonctions", items: 8 },
                    { title: "Série 3: Barycentre", items: 6 },
                    { title: "Série 4: Récurrence", items: 6 }
                ],
                exams: [
                    { title: "Devoir 1: Logique", type: "Devoir" },
                    { title: "Devoir 2: Fonctions", type: "Devoir" },
                    { title: "Devoir 3: Barycentre", type: "Devoir" },
                    { title: "Examen régional 2024", type: "Examen" }
                ]
            },
            physique: {
                title: "Physique",
                desc: "Cours, exercices, séries, devoirs et examens régionaux",
                lessons: [
                    { title: "Mouvement rectiligne", file: "lessons/mouvement.html", desc: "Position, vitesse, accélération" },
                    { title: "Lois de Newton", file: "lessons/newton.html", desc: "Les trois lois de Newton" }
                ],
                exercices: [
                    {
                        title: "Mécanique",
                        icon: "⚡",
                        file: "exercices/mecanique/index.html",
                        list: [
                            { num: 1, title: "Exercice 1", file: "exercices/mecanique/exercice1.html", diff: "Facile" },
                            { num: 2, title: "Exercice 2", file: "exercices/mecanique/exercice2.html", diff: "Moyen" }
                        ]
                    }
                ],
                series: [
                    { title: "Série 1: Mécanique", items: 8 },
                    { title: "Série 2: Ondes", items: 6 }
                ],
                exams: [
                    { title: "Devoir 1: Mécanique", type: "Devoir" },
                    { title: "Examen régional 2024", type: "Examen" }
                ]
            },
            chimie: {
                title: "Chimie",
                desc: "Cours, exercices, séries, devoirs et examens régionaux",
                lessons: [
                    { title: "Structure de l'atome", file: "lessons/atome.html", desc: "Noyau, électrons, configuration" },
                    { title: "Réactions chimiques", file: "lessons/reactions.html", desc: "Équations bilan, stoechiométrie" }
                ],
                exercices: [
                    {
                        title: "Atome",
                        icon: "🧪",
                        file: "exercices/atome/index.html",
                        list: [
                            { num: 1, title: "Exercice 1", file: "exercices/atome/exercice1.html", diff: "Facile" },
                            { num: 2, title: "Exercice 2", file: "exercices/atome/exercice2.html", diff: "Moyen" }
                        ]
                    }
                ],
                series: [
                    { title: "Série 1: Atome", items: 6 },
                    { title: "Série 2: Réactions", items: 8 }
                ],
                exams: [
                    { title: "Devoir 1: Atome", type: "Devoir" },
                    { title: "Examen régional 2024", type: "Examen" }
                ]
            }
        };

        let currentSubject = null;
        let currentTab = 'lessons';
        let selectedExerciceGroup = null;

        function loadSubject() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('subject');
            currentSubject = data[id];
            
            if (!currentSubject) {
                document.getElementById('subjectTitle').textContent = '⚠️ Matière non trouvée';
                document.getElementById('tabContent').innerHTML = '<div class="no-data">Matière non trouvée</div>';
                return;
            }
            
            document.getElementById('subjectTitle').textContent = currentSubject.title;
            document.getElementById('subjectDesc').textContent = currentSubject.desc;
            
            switchTab('lessons');
        }

        function getBadgeClass(diff) {
            if (diff === 'Facile') return 'badge-facile';
            if (diff === 'Moyen') return 'badge-moyen';
            if (diff === 'Difficile') return 'badge-difficile';
            return 'badge-exercice';
        }

        function showExerciceGroup(index) {
            selectedExerciceGroup = index;
            const group = currentSubject.exercices[index];
            const container = document.getElementById('tabContent');
            
            container.innerHTML = `
                <button class="back-btn-small" onclick="showExercicesList()">
                    <i class="fas fa-arrow-right"></i> Retour aux exercices
                </button>
                <div style="margin-bottom:12px;">
                    <h2 style="color:#4ECDC4; font-size:18px;">${group.icon} ${group.title}</h2>
                    <p style="color:var(--text-muted); font-size:13px;">${group.list.length} exercices</p>
                </div>
                ${group.list.map(ex => `
                    <a href="${ex.file}" class="ex-link">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="color:#4ECDC4; font-size:16px; flex-shrink:0;"><i class="fas fa-circle-check"></i></span>
                            <div style="flex:1;">
                                <div style="color:#4ECDC4; font-weight:700; font-size:13px;">Exercice ${ex.num}</div>
                                <div style="color:var(--text-secondary); font-size:12px; line-height:1.4;">${ex.title}</div>
                            </div>
                            <span class="badge ${getBadgeClass(ex.diff)}" style="flex-shrink:0;">${ex.diff}</span>
                            <span style="color:var(--text-muted); font-size:12px; flex-shrink:0;"><i class="fas fa-chevron-left"></i></span>
                        </div>
                    </a>
                `).join('')}
            `;
        }

        function showExercicesList() {
            selectedExerciceGroup = null;
            const container = document.getElementById('tabContent');
            
            container.innerHTML = currentSubject.exercices.map((e, i) => `
                <div class="command-card" onclick="showExerciceGroup(${i})">
                    <div class="command-title">${e.icon} ${e.title}</div>
                    <p style="color:var(--text-secondary);">${e.list.length} exercices</p>
                    <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
                        <span class="badge" style="background:#E8873A22; color:#E8873A;"><i class="fas fa-folder-open"></i> Voir les exercices</span>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            selectedExerciceGroup = null;
            
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            
            const container = document.getElementById('tabContent');
            
            if (tab === 'lessons') {
                container.innerHTML = currentSubject.lessons.map((l, i) => `
                    <div class="command-card" onclick="location.href='${l.file}'">
                        <div class="command-title">${i+1}. ${l.title}</div>
                        <p style="color:var(--text-secondary);">${l.desc}</p>
                        <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
                            <span class="badge" style="background:#4ECDC422; color:#4ECDC4;"><i class="fas fa-eye"></i> Voir le cours</span>
                        </div>
                    </div>
                `).join('');
            } else if (tab === 'exercices') {
                showExercicesList();
            } else if (tab === 'series') {
                container.innerHTML = currentSubject.series.map((s, i) => `
                    <div class="command-card">
                        <div class="command-title">${i+1}. ${s.title}</div>
                        <p style="color:var(--text-secondary);">${s.items} exercices</p>
                        <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
                            <span class="badge" style="background:#F4D03F22; color:#F4D03F;"><i class="fas fa-download"></i> Télécharger PDF</span>
                        </div>
                    </div>
                `).join('');
            } else if (tab === 'exams') {
                container.innerHTML = currentSubject.exams.map((e, i) => `
                    <div class="command-card">
                        <div class="command-title">${i+1}. ${e.title}</div>
                        <p style="color:var(--text-secondary);"><span class="badge" style="background:${e.type === 'Devoir' ? '#FF6B6B22' : '#BB8FCE22'}; color:${e.type === 'Devoir' ? '#FF6B6B' : '#BB8FCE'};">${e.type}</span></p>
                        <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
                            <span class="badge" style="background:#4ECDC422; color:#4ECDC4;"><i class="fas fa-download"></i> Télécharger</span>
                            <span class="badge" style="background:#A8FF7822; color:#A8FF78;"><i class="fas fa-check"></i> Correction</span>
                        </div>
                    </div>
                `).join('');
            }
            
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        loadSubject();
    </script>
</body>
</html>
